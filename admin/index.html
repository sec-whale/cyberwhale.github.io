<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CyberWhale Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
	margin:0;
	padding:0;
	box-sizing:border-box;
}

body{
	font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;
	background:linear-gradient(135deg,#f8fcff,#dff3ff);
	color:#16324a;
	min-height:100vh;
}

header{
	height:75px;
	display:flex;
	align-items:center;
	justify-content:space-between;
	padding:0 70px;
	background:rgba(255,255,255,.75);
	backdrop-filter:blur(20px);
	border-bottom:1px solid #d9edff;
	position:sticky;
	top:0;
	z-index:50;
}

.logo{
	font-size:26px;
	font-weight:700;
}

.logo span{
	color:#168bd2;
}

nav a{
	margin-left:30px;
	text-decoration:none;
	color:#5c7890;
}

nav a:hover{
	color:#168bd2;
}

#logout{
	margin-left:30px;
	color:#168bd2;
	cursor:pointer;
}

.tabs{
	width:90%;
	max-width:1400px;
	margin:30px auto 0;
	display:flex;
	gap:10px;
}

.tab{
	padding:10px 18px;
	border-radius:14px;
	background:rgba(255,255,255,.78);
	box-shadow:0 5px 18px rgba(0,120,200,.08);
	cursor:pointer;
	color:#58758b;
	user-select:none;
	transition:.2s;
}

.tab:hover{
	background:#eaf6ff;
}

.tab.active{
	background:#168bd2;
	color:white;
}

.page{
	display:none;
}

.page.active{
	display:block;
}

.container{
	width:90%;
	max-width:1400px;
	margin:20px auto 40px;
	display:grid;
	grid-template-columns:420px minmax(0,1fr);
	gap:30px;
	align-items:start;
}

.panel,
.editor,
.user-panel{
	background:rgba(255,255,255,.82);
	backdrop-filter:blur(20px);
	border-radius:24px;
	box-shadow:0 10px 30px rgba(0,120,200,.12);
	padding:28px;
}

.panel{
	position:sticky;
	top:125px;
}

.panel-title{
	display:flex;
	align-items:center;
	justify-content:space-between;
	margin-bottom:22px;
}

.panel-title h2,
.editor h2,
.user-panel h2{
	font-size:22px;
}

.new-btn,
.save,
.normal-btn{
	border:0;
	padding:10px 17px;
	border-radius:12px;
	background:#168bd2;
	color:white;
	cursor:pointer;
	font-size:14px;
	font-family:inherit;
}

.new-btn:hover,
.save:hover,
.normal-btn:hover{
	background:#087cc0;
}

.posts{
	display:flex;
	flex-direction:column;
	gap:10px;
	max-height:calc(100vh - 240px);
	min-height:200px;
	overflow-y:auto;
	overflow-x:hidden;
	padding-right:7px;
	overscroll-behavior:contain;
	scrollbar-gutter:stable;
}

.posts::-webkit-scrollbar{
	width:8px;
}

.posts::-webkit-scrollbar-track{
	background:transparent;
}

.posts::-webkit-scrollbar-thumb{
	background:#c5dcea;
	border-radius:10px;
}

.posts::-webkit-scrollbar-thumb:hover{
	background:#9fc8df;
}

.group{
	border-radius:16px;
	overflow:hidden;
	background:#f5fbff;
	border:1px solid #e1f1fc;
	flex-shrink:0;
}

.group-title{
	padding:14px 16px;
	display:flex;
	align-items:center;
	justify-content:space-between;
	font-weight:600;
	cursor:pointer;
	color:#315b76;
	background:#eef8ff;
	user-select:none;
}

.group-title:hover{
	background:#e3f4ff;
}

.arrow{
	font-size:12px;
	transition:.2s;
}

.group.closed .arrow{
	transform:rotate(-90deg);
}

.group-content{
	padding:8px;
	display:flex;
	flex-direction:column;
	gap:7px;
}

.group.closed .group-content{
	display:none;
}

.post{
	padding:12px 13px;
	border-radius:12px;
	cursor:pointer;
	transition:.2s;
}

.post:hover{
	background:#e5f5ff;
}

.post.active{
	background:#d9f0ff;
}

.post-title{
	font-weight:600;
	font-size:16px;
	margin-bottom:5px;
}

.post-id{
	color:#168bd2;
	margin-right:7px;
}

.post-info{
	font-size:13px;
	color:#8197a9;
}

.row{
	display:grid;
	grid-template-columns:1fr 1fr;
	gap:20px;
}

.field{
	margin-bottom:20px;
}

.field label{
	display:block;
	font-size:14px;
	font-weight:600;
	margin-bottom:8px;
	color:#48687f;
}

input,
textarea{
	width:100%;
	border:1px solid #d5e9f6;
	outline:none;
	background:#fafdff;
	border-radius:13px;
	padding:12px 14px;
	font-family:inherit;
	font-size:15px;
	color:#16324a;
}

input:focus,
textarea:focus{
	border-color:#61b3e7;
	box-shadow:0 0 0 3px rgba(63,169,235,.1);
}

textarea{
	min-height:420px;
	resize:vertical;
	font-family:Consolas,"Courier New",monospace;
	line-height:1.6;
}

.roles{
	display:flex;
	flex-wrap:wrap;
	gap:10px;
	padding:12px;
	background:#f7fbfe;
	border-radius:13px;
	border:1px solid #d5e9f6;
}

.role-check{
	display:flex;
	align-items:center;
	gap:6px;
	padding:7px 11px;
	border-radius:10px;
	background:#eaf6fd;
}

.role-check input{
	width:auto;
}

.actions{
	display:flex;
	flex-wrap:wrap;
	gap:12px;
	margin-top:5px;
}

.delete{
	border:0;
	padding:11px 22px;
	border-radius:12px;
	background:#ffe8e8;
	color:#d94a4a;
	cursor:pointer;
	font-size:15px;
	display:none;
	font-family:inherit;
}

.cancel{
	border:0;
	padding:11px 22px;
	border-radius:12px;
	background:#edf4f8;
	color:#567;
	cursor:pointer;
	font-size:15px;
	font-family:inherit;
}

#message,
#downloadMessage,
#toolMessage,
#userMessage,
#passwordMessage{
	margin-top:18px;
	min-height:20px;
	font-size:14px;
}

.success{
	color:#219653;
}

.error{
	color:#d9534f;
}

.loading{
	position:fixed;
	inset:0;
	display:flex;
	align-items:center;
	justify-content:center;
	background:#edf8ff;
	color:#66879d;
	font-size:18px;
	z-index:100;
}

.users-wrap{
	width:90%;
	max-width:1200px;
	margin:20px auto 40px;
}

.user-panel{
	margin-bottom:25px;
}

.user-grid{
	display:grid;
	grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
	gap:15px;
	margin-top:20px;
}

.user-card{
	padding:18px;
	background:#f5fbff;
	border-radius:16px;
	border:1px solid #e1f1fc;
}

.user-name{
	font-size:17px;
	font-weight:600;
	margin-bottom:6px;
}

.user-email{
	font-size:13px;
	color:#8197a9;
	margin-bottom:12px;
	word-break:break-all;
}

.small-actions{
	display:flex;
	flex-wrap:wrap;
	gap:8px;
	margin-top:10px;
}

.small-btn{
	border:0;
	padding:8px 12px;
	border-radius:10px;
	cursor:pointer;
	background:#e4f4ff;
	color:#168bd2;
	font-family:inherit;
}

.empty{
	text-align:center;
	padding:35px 10px;
	color:#8aa0b1;
}

footer{
	text-align:center;
	padding:35px;
	color:#789;
}

@media(max-width:900px){

	header{
		padding:0 25px;
	}

	.tabs{
		width:90%;
		overflow:auto;
	}

	.tab{
		white-space:nowrap;
	}

	.container{
		grid-template-columns:1fr;
	}

	.panel{
		position:static;
	}

	.posts{
		max-height:500px;
	}

	.row{
		grid-template-columns:1fr;
		gap:0;
	}

}

</style>

</head>

<script>

const supabaseUrl=
"https://jxbxswghraiwucjnyhhh.supabase.co";

const supabaseKey=
"sb_publishable_g9aX_HIuZL6LBNM5RUxLYQ_gdi127En";

const client=
supabase.createClient(
	supabaseUrl,
	supabaseKey
);

let currentProfile=null;
let allPosts=[];
let allDownloads=[];
let allTools=[];
let allUsers=[];
let allRoles=[];
let editingId=null;
let editingDownloadId=null;
let editingToolId=null;

function naturalCompare(a,b){

	return String(a || "")
	.localeCompare(
		String(b || ""),
		"zh-CN",
		{
			numeric:true,
			sensitivity:"base"
		}
	);

}

function today(){

	const d=new Date();

	return (
		d.getFullYear()
		+"-"+
		String(
			d.getMonth()+1
		).padStart(2,"0")
		+"-"+
		String(
			d.getDate()
		).padStart(2,"0")
	);

}

function showMessage(id,text,type=""){

	const box=
	document.getElementById(id);

	if(!box){
		return;
	}

	box.innerText=text;
	box.className=type;

}

async function checkBackend(){

	const {data,error}=
	await client.auth.getSession();

	if(
		error ||
		!data.session
	){

		location.replace(
			"/login/"
		);

		return false;
	}

	const email=
	data.session.user.email;

	const {
		data:profile,
		error:profileError
	}=
	await client
	.from("profile")
	.select("*")
	.eq(
		"email",
		email
	)
	.single();

	if(
		profileError ||
		!profile
	){

		location.replace(
			"/blog/"
		);

		return false;
	}

	if(
		profile.role!=="admin"
		&&
		profile.role!=="writer"
	){

		alert(
			"你没有后台权限"
		);

		location.replace(
			"/blog/"
		);

		return false;
	}

	currentProfile=
	profile;

	if(
		currentProfile.role===
		"writer"
	){

		document
		.querySelectorAll(
			".admin-only"
		)
		.forEach(item=>{

			item.style.display=
			"none";

		});

	}

	document
	.getElementById(
		"loading"
	)
	.style.display=
	"none";

	return true;

}

async function logout(){

	await client.auth.signOut();

	sessionStorage.clear();

	location.replace(
		"/blog/login/"
	);

}

async function loadUsers(){

	if(
		currentProfile.role!==
		"admin"
	){

		allUsers=[];

		allRoles=[
			"admin",
			"writer",
			"user"
		];

		renderRoleChecks();

		return;
	}

	const {data,error}=
	await client
	.from("profile")
	.select("*")
	.order(
		"username",
		{
			ascending:true
		}
	);

	if(error){

		console.log(
			error
		);

		return;
	}

	allUsers=
	data || [];

	allRoles=[
		...new Set(
			allUsers
			.map(
				x=>x.role
			)
			.filter(Boolean)
		)
	];

	if(!allRoles.includes("admin")){
		allRoles.push("admin");
	}

	if(!allRoles.includes("writer")){
		allRoles.push("writer");
	}

	if(!allRoles.includes("user")){
		allRoles.push("user");
	}

	allRoles.sort(
		naturalCompare
	);

	renderRoleChecks();

	renderUsers();

}

function renderRoleChecks(){

	const box=
	document.getElementById(
		"roleChecks"
	);

	box.innerHTML="";

	allRoles.forEach(role=>{

		const label=
		document.createElement(
			"label"
		);

		label.className=
		"role-check";

		const input=
		document.createElement(
			"input"
		);

		input.type=
		"checkbox";

		input.value=
		role;

		const text=
		document.createElement(
			"span"
		);

		text.innerText=
		role;

		label.appendChild(
			input
		);

		label.appendChild(
			text
		);

		box.appendChild(
			label
		);

	});

}

function getSelectedRoles(){

	return [
		...document.querySelectorAll(
			"#roleChecks input:checked"
		)
	]
	.map(
		x=>x.value
	);

}

function setSelectedRoles(roles){

	document
	.querySelectorAll(
		"#roleChecks input"
	)
	.forEach(input=>{

		input.checked=
			(roles || [])
			.includes(
				input.value
			);

	});

}

async function loadPosts(){

	const box=
	document.getElementById(
		"posts"
	);

	box.innerHTML=
	`
	<div class="empty">
		正在读取...
	</div>
	`;

	const {data,error}=
	await client
	.from("posts")
	.select("*");

	if(error){

		console.log(
			"文章读取错误：",
			error
		);

		box.innerHTML=
		`
		<div class="empty">
			文章读取失败
		</div>
		`;

		return;
	}

	allPosts=
	data || [];

	if(
		currentProfile.role===
		"writer"
	){

		allPosts=
		allPosts.filter(
			post=>
				post.author===
				currentProfile.username
		);

function renderPosts(){

	const box=
	document.getElementById(
		"posts"
	);

	box.innerHTML="";

	if(allPosts.length===0){

		box.innerHTML=
		`
		<div class="empty">
			暂无文章
		</div>
		`;

		return;
	}

	let categories=[
		...new Set(
			allPosts.map(
				post=>
					post.category ||
					"未分类"
			)
		)
	];

	categories.sort(
		naturalCompare
	);

	categories.forEach(category=>{

		const group=
		document.createElement(
			"div"
		);

		group.className=
		"group closed";

		const head=
		document.createElement(
			"div"
		);

		head.className=
		"group-title";

		let posts=
		allPosts.filter(
			post=>
				(post.category || "未分类")
				===
				category
		);

		posts.sort(
			(a,b)=>
				naturalCompare(
					a.id,
					b.id
				)
		);

		const name=
		document.createElement(
			"span"
		);

		name.innerText=
			category+
			" ("+
			posts.length+
			")";

		const arrow=
		document.createElement(
			"span"
		);

		arrow.className=
		"arrow";

		arrow.innerText=
		"▼";

		head.appendChild(
			name
		);

		head.appendChild(
			arrow
		);

		const content=
		document.createElement(
			"div"
		);

		content.className=
		"group-content";

		posts.forEach(post=>{

			const item=
			document.createElement(
				"div"
			);

			item.className=
			"post";

			if(
				post.id===
				editingId
			){

				item.classList.add(
					"active"
				);

			}

			const title=
			document.createElement(
				"div"
			);

			title.className=
			"post-title";

			const id=
			document.createElement(
				"span"
			);

			id.className=

			id.innerText=

			title.appendChild(

			);

			title.appendChild(

					post.title || ""

			document.createElement(
				"div"
			);

			info.className=

			info.innerText=

				+
				" · "
				+
				(post.date || "");

			item.appendChild(
				title
			);

			item.appendChild(
				info
			);

			item.onclick=
				()=>editPost(
					post.id

			content.appendChild(
				item
			);

				);

async function savePost(){

	const id=
	document
	.getElementById(
			"postId"
		)
	.value
	.trim();

	const title=
	document
	.getElementById(
			"title"
		)
	.value
	.trim();

	const category=
	document
	.getElementById(
			"category"
		)
	.value
	.trim();

	const date=
	document
	.getElementById(
			"date"
		)
	.value;

	const file=
	document
	.getElementById(
			"file"
		)
	.value;

	const allowedRoles=
	getSelectedRoles();

	if(!id){

		showMessage(
			"message",
			"请填写编号",
			"error"
		);

		return;
	}

	if(!title){

		showMessage(
			"message",
			"请填写标题",
			"error"
		);

		return;
	}

	if(!category){

		showMessage(
			"message",
			"请填写分类",
			"error"
		);

		return;
	}

	if(!file.trim()){

		showMessage(
			"message",
			"请填写正文",
			"error"
		);

		return;
	}

	if(
		allowedRoles.length===0
	){

		showMessage(
			"message",
			"至少选择一种可查看权限",
			"error"
		);

		return;
	}

	if(editingId===null){

		const {error}=
		await client
		.from("posts")
		.insert({
			id:id,
			title:title,
			category:category,
			date:date,
			file:file,
			author:
				currentProfile.username,
			allowed_roles:
				allowedRoles
		});

		if(error){

			showMessage(
				"message",
				"保存失败："+error.message,
				"error"
			);

			return;
		}

		await loadPosts();

		newPost();

		showMessage(
			"message",
			"文章创建成功",
			"success"
		);

	}else{

		const post=
		allPosts.find(
			x=>x.id===editingId
		);

		if(
			currentProfile.role===
			"writer"
			&&
			post?.author!==
			currentProfile.username
		){

			showMessage(
				"message",
				"你只能修改自己的文章",
				"error"
			);

			return;
		}

		const {error}=
		await client
		.from("posts")
		.update({
			title:title,
			category:category,
			date:date,
			file:file,
			allowed_roles:
				allowedRoles
		})
		.eq(
			"id",
			editingId
		);

		if(error){

			showMessage(
				"message",
				"保存失败："+error.message,
				"error"
			);

			return;
		}

		await loadPosts();

		showMessage(
			"message",
			"文章保存成功",
			"success"
		);

	}

}

async function deletePost(){

	if(!editingId){
		return;
	}

	const post=
	allPosts.find(
		x=>x.id===editingId
	);

	if(
		currentProfile.role===
		"writer"
		&&
		post?.author!==
		currentProfile.username
	){

		alert(
			"你只能删除自己的文章"
		);

		return;
	}

	if(
		!confirm(
			"确定删除《"+

			"》吗？"

	const {error}=

	.from("posts")

	);

	if(error){

		showMessage(

		);

	}

	await loadPosts();

	newPost();

}

	.getElementById(

	.getElementById(

async function saveTool(){

	if(
		currentProfile.role!==
		"admin"
	){
		return;
	}

	const name=
	document
	.getElementById(
		"toolName"
	)
	.value
	.trim();

	const icon=
	document
	.getElementById(
		"toolIcon"
	)
	.value
	.trim();

	const description=
	document
	.getElementById(
		"toolDescription"
	)
	.value
	.trim();

	const url=
	document
	.getElementById(
		"toolUrl"
	)
	.value
	.trim();

	const sort=
	Number(
		document
		.getElementById(
			"toolSort"
		)
		.value
	) || 0;

	const enabled=
	document
	.getElementById(
		"toolEnabled"
	)
	.checked;

	if(!name){

		showMessage(
			"toolMessage",
			"请填写名称",
			"error"
		);

		return;
	}

	if(!url){

		showMessage(
			"toolMessage",
			"请填写链接",
			"error"
		);

		return;
	}

	if(
		editingToolId===
		null
	){

		const {error}=
		await client
		.from("tools")
		.insert({
			name:name,
			icon:icon,
			description:description,
			url:url,
			sort:sort,
			enabled:enabled
		});

		if(error){

			showMessage(
				"toolMessage",
				"保存失败："+error.message,
				"error"
			);

			return;
		}

		await loadTools();

		newTool();

		showMessage(
			"toolMessage",
			"工具创建成功",
			"success"
		);

	}else{

		const {error}=
		await client
		.from("tools")
		.update({
			name:name,
			icon:icon,
			description:description,
			url:url,
			sort:sort,
			enabled:enabled
		})
		.eq(
			"id",
			editingToolId
		);

		if(error){

			showMessage(
				"toolMessage",
				"保存失败："+error.message,
				"error"
			);

			return;
		}

		await loadTools();

		showMessage(
			"toolMessage",
			"工具保存成功",
			"success"
		);

	}

}

async function deleteTool(){

	if(
		currentProfile.role!==
		"admin"
		||
		editingToolId===
		null
	){
		return;
	}

	const tool=
	allTools.find(
		x=>
			x.id===
			editingToolId
	);

	if(
		!confirm(
			"确定删除《"+
			(tool?.name || "")+
			"》吗？"
		)
	){
		return;
	}

	const {error}=
	await client
	.from("tools")
	.delete()
	.eq(
		"id",
		editingToolId
	);

	if(error){

		showMessage(
			"toolMessage",
			"删除失败："+error.message,
			"error"
		);

		return;
	}

	await loadTools();

	newTool();

}

/* admin 用户管理 */

function renderUsers(){

	if(
		currentProfile.role!==
		"admin"
	){
		return;
	}

	const box=
	document.getElementById(
		"userList"
	);

	box.innerHTML="";

	allUsers.forEach(user=>{

		const card=
		document.createElement(
			"div"
		);

		card.className=
		"user-card";

		card.innerHTML=
		`
		<div class="user-name">
			${user.username || ""}
		</div>

		<div class="user-email">
			${user.email || ""}
		</div>
		`;

		const role=
		document.createElement(
			"input"
		);

		role.id=
		"role-"+user.id;

		role.value=
		user.role || "";

		const actions=
		document.createElement(
			"div"
		);

		actions.className=
		"small-actions";

		const save=
		document.createElement(
			"button"
		);

		save.className=
		"small-btn";

		save.innerText=
		"保存权限";

		save.onclick=
			()=>saveUserRole(
				user.id
			);

		const password=
		document.createElement(
			"button"
		);

		password.className=
		"small-btn";

		password.innerText=
		"改密码";

		password.onclick=
			()=>changeOtherPassword(
				user
			);

		actions.appendChild(
			save
		);

		actions.appendChild(
			password
		);

		card.appendChild(
			role
		);

		card.appendChild(
			actions
		);

		box.appendChild(
			card
		);

	});

}

async function saveUserRole(id){

	if(
		currentProfile.role!==
		"admin"
	){
		return;
	}

	const role=
	document
	.getElementById(
			"role-"+id
		)
	.value
	.trim();

	const {error}=
	await client
	.from("profile")
	.update({
		role:role
	})
	.eq(
		"id",
		id
	);

	if(error){

		alert(
			"修改失败："+error.message
		);

		return;
	}

	alert(
		"权限已修改"
	);

	await loadUsers();

}

async function callAdminFunction(body){

	if(
		currentProfile.role!==
		"admin"
	){

		throw new Error(
			"没有管理员权限"
		);

	}

	const {
		data:{
			session
		}
	}=
	await client.auth.getSession();

	const response=
	await fetch(
		supabaseUrl+
		"/functions/v1/admin-users",
		{
			method:"POST",

			headers:{
				"Content-Type":
					"application/json",

				"Authorization":
					"Bearer "+
					session.access_token
			},

			body:
				JSON.stringify(
					body
				)
		}
	);

	let result={};

	try{

		result=
		await response.json();

	}catch(e){}

	if(!response.ok){

		throw new Error(
			result.error ||
			"请求失败"
		);

	}

	return result;

}

async function addUser(){

	const username=
	document
	.getElementById(
			"newUsername"
		)
	.value
	.trim();

	const email=
	document
	.getElementById(
			"newEmail"
		)
	.value
	.trim();

	const password=
	document
	.getElementById(
			"newPassword"
		)
	.value;

	const role=
	document
	.getElementById(
			"newRole"
		)
	.value
	.trim();

	if(
		!username ||
		!email ||
		!password ||
		!role
	){

		showMessage(
			"userMessage",
			"请填写完整",
			"error"
		);

		return;
	}

	try{

		await callAdminFunction({
			action:"create",
			username:username,
			email:email,
			password:password,
			role:role
		});

		showMessage(
			"userMessage",
			"用户添加成功",
			"success"
		);

		await loadUsers();

	}catch(error){

		showMessage(
			"userMessage",
			"添加失败："+error.message,
			"error"
		);

	}

}

async function changeOtherPassword(user){

	const password=
	prompt(
		"输入 "+
		(user.username || user.email)+
		" 的新密码"
	);

	if(!password){
		return;
	}

	try{

		await callAdminFunction({
			action:"password",
			email:user.email,
			password:password
		});

		alert(
			"密码修改成功"
		);

	}catch(error){

		alert(
			"修改失败："+error.message
		);

	}

}

async function changeMyPassword(){

	const password=
	document
	.getElementById(
			"myPassword"
		)
	.value;

	const password2=
	document
	.getElementById(
			"myPassword2"
		)
	.value;

	if(!password){

		showMessage(
			"passwordMessage",
			"请输入新密码",
			"error"
		);

		return;
	}

	if(password!==password2){

		showMessage(
			"passwordMessage",
			"两次密码不一致",
			"error"
		);

		return;
	}

	const {error}=
	await client.auth.updateUser({
		password:password
	});

	if(error){

		showMessage(
			"passwordMessage",
			"修改失败："+error.message,
			"error"
		);

		return;
	}

	showMessage(
		"passwordMessage",
		"密码修改成功",
		"success"
	);

}

document

.forEach(tab=>{

			currentProfile.role!==
			"admin"
			&&
			tab.classList.contains(
				"admin-only"
			)
		){

			return;
		}

		document
		.querySelectorAll(
			".tab"
		)
		.forEach(x=>
			x.classList.remove(
				"active"
			)
		);

		document
		.querySelectorAll(
			".page"
		)
		.forEach(x=>
			x.classList.remove(
				"active"
			)
		);

		tab.classList.add(
			"active"
		);

		document
		.getElementById(
			tab.dataset.page
		)
		.classList.add(
			"active"
		);

	};

});
