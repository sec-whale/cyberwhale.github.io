<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CyberWhale Tools</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{
	margin:0;
	padding:0;
	box-sizing:border-box;
}
body{
	font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;
	background:linear-gradient(135deg,#f8fcff,#dff3ff);
	color:#16324a;
	min-height:100vh;
}
header{
	height:75px;
	display:flex;
	align-items:center;
	justify-content:space-between;
	padding:0 70px;
	background:rgba(255,255,255,.75);
	backdrop-filter:blur(20px);
	border-bottom:1px solid #d9edff;
	position:sticky;
	top:0;
	z-index:50;
}
.logo{
	font-size:26px;
	font-weight:700;
	text-decoration:none;
	color:#16324a;
	white-space:nowrap;
}
.logo span{
	color:#168bd2;
}
.header-right{
	display:flex;
	align-items:center;
	gap:24px;
}
nav{
	display:flex;
	align-items:center;
	gap:28px;
}
nav a{
	text-decoration:none;
	color:#5c7890;
	font-size:15px;
	transition:.2s;
	white-space:nowrap;
}
nav a:hover,
nav a.active{
	color:#168bd2;
}
.user-menu{
	display:none;
	align-items:center;
	gap:14px;
}
.username{
	color:#48687f;
	font-size:14px;
	white-space:nowrap;
}
.manage-btn{
	display:none;
	text-decoration:none;
	color:#168bd2;
	font-size:14px;
	white-space:nowrap;
}
.logout-btn{
	border:0;
	background:none;
	color:#168bd2;
	font:inherit;
	font-size:14px;
	cursor:pointer;
}
.container{
	width:85%;
	max-width:1200px;
	margin:45px auto;
}
.page-header{
	margin-bottom:28px;
}
.page-header h1{
	font-size:30px;
	margin-bottom:7px;
}
.page-header p{
	color:#7894a8;
	font-size:15px;
}
.tools-grid{
	display:grid;
	grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
	gap:18px;
	align-items:start;
}
.tool-card{
	min-height:115px;
	padding:20px 22px;
	background:rgba(255,255,255,.82);
	backdrop-filter:blur(20px);
	border-radius:22px;
	box-shadow:0 10px 30px rgba(0,120,200,.12);
	text-decoration:none;
	color:#16324a;
	display:flex;
	align-items:center;
	gap:16px;
	transition:.25s;
}
.tool-card:hover{
	transform:translateY(-4px);
	background:rgba(255,255,255,.96);
	box-shadow:0 14px 35px rgba(0,120,200,.16);
}
.tool-icon{
	width:48px;
	height:48px;
	min-width:48px;
	border-radius:15px;
	background:#e4f4ff;
	display:flex;
	align-items:center;
	justify-content:center;
	font-size:24px;
}
.tool-info{
	flex:1;
	min-width:0;
}
.tool-name{
	font-size:18px;
	font-weight:600;
	margin-bottom:7px;
}
.tool-desc{
	font-size:13px;
	color:#7894a8;
	line-height:1.5;
}
.tool-arrow{
	font-size:20px;
	color:#9bb7c9;
	transition:.2s;
}
.tool-card:hover .tool-arrow{
	color:#168bd2;
	transform:translateX(3px);
}
.loading,.empty,.error{
	grid-column:1/-1;
	padding:45px;
	background:rgba(255,255,255,.82);
	border-radius:22px;
	box-shadow:0 10px 30px rgba(0,120,200,.12);
	text-align:center;
	color:#7894a8;
}
.error{
	color:#d9534f;
}
footer{
	text-align:center;
	padding:35px;
	color:#789;
}
@media(max-width:1050px){
	header{
		padding:0 30px;
	}
	nav{
		gap:16px;
	}
}
@media(max-width:800px){
	header{
		height:auto;
		min-height:75px;
		padding:16px 20px;
		flex-direction:column;
		align-items:flex-start;
		gap:14px;
	}
	.header-right{
		width:100%;
		flex-wrap:wrap;
	}
	nav{
		flex-wrap:wrap;
	}
	.container{
		width:90%;
		margin-top:30px;
	}
}
@media(max-width:600px){
	.tools-grid{
		grid-template-columns:1fr;
	}
}
</style>
</head>
<body>

<header>
<a class="logo" href="https://cyberwhale.net/">
	🐋 Cyber<span>Whale</span> Tools
</a>

<div class="header-right">
	<nav>
		<a href="https://cyberwhale.net/">Home</a>
		<a href="https://cyberwhale.net/blog/">Blog</a>
		<a href="https://cyberwhale.net/download/">Download</a>
		<a href="https://cyberwhale.net/about">About</a>
		<a href="https://cyberwhale.net/tools/" class="active">Tools</a>
	</nav>

	<div class="user-menu" id="userMenu">
		<a class="manage-btn" id="manageButton" href="https://cyberwhale.net/admin/">管理</a>
		<span class="username" id="username"></span>
		<button class="logout-btn" onclick="logout()">登出</button>
	</div>
</div>
</header>

<main class="container">
	<div class="page-header">
		<h1>工具箱</h1>
		<p>CyberWhale 实用工具与站内服务</p>
	</div>

	<div class="tools-grid" id="toolsContainer">
		<div class="loading">正在读取工具...</div>
	</div>
</main>

<footer>
© 2026 CyberWhale
</footer>

<script>
const supabaseUrl="https://jxbxswghraiwucjnyhhh.supabase.co";
const supabaseKey="sb_publishable_g9aX_HIuZL6LBNM5RUxLYQ_gdi127En";
const client=supabase.createClient(supabaseUrl,supabaseKey);

const container=document.getElementById("toolsContainer");

async function loadUser(){
	const {data:{session}}=await client.auth.getSession();

	if(!session){
		return;
	}

	const {data:profile}=await client
	.from("profile")
	.select("username,role,email")
	.eq("email",session.user.email)
	.single();

	if(!profile){
		return;
	}

	document.getElementById("userMenu").style.display="flex";
	document.getElementById("username").textContent=
		(profile.username||session.user.email)+" · "+(profile.role||"user");

	if(profile.role==="admin"){
		document.getElementById("manageButton").style.display="inline";
	}
}

async function loadTools(){
	container.innerHTML='<div class="loading">正在读取工具...</div>';

	const {data,error}=await client
	.from("tools")
	.select("id,name,icon,description,url,sort,enabled")
	.eq("enabled",true)
	.order("sort",{ascending:true})
	.order("id",{ascending:true});

	if(error){
		container.innerHTML=
			'<div class="error">工具读取失败：'+escapeHtml(error.message)+'</div>';
		return;
	}

	const tools=data||[];

	if(!tools.length){
		container.innerHTML='<div class="empty">暂无工具</div>';
		return;
	}

	container.innerHTML=tools.map(tool=>`
		<a class="tool-card"
		   href="${escapeAttr(tool.url||"#")}"
		   target="_blank"
		   rel="noopener noreferrer">
			<div class="tool-icon">${escapeHtml(tool.icon||"🛠️")}</div>
			<div class="tool-info">
				<div class="tool-name">${escapeHtml(tool.name||"未命名工具")}</div>
				<div class="tool-desc">${escapeHtml(tool.description||"")}</div>
			</div>
			<div class="tool-arrow">→</div>
		</a>
	`).join("");
}

async function logout(){
	await client.auth.signOut();
	location.href="https://cyberwhale.net/login/";
}

function escapeHtml(text){
	return String(text??"").replace(/[&<>"']/g,char=>({
		"&":"&amp;",
		"<":"&lt;",
		">":"&gt;",
		'"':"&quot;",
		"'":"&#39;"
	})[char]);
}

function escapeAttr(text){
	return String(text??"")
	.replace(/&/g,"&amp;")
	.replace(/"/g,"&quot;")
	.replace(/</g,"&lt;")
	.replace(/>/g,"&gt;");
}

loadUser();
loadTools();
</script>

</body>
</html>
