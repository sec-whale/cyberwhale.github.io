<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CyberWhale Blog 登录</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:linear-gradient(
        135deg,
        #e8f6ff,
        #cfeaff
    );

    font-family:
    "Microsoft YaHei",
    Arial;

}


.box{

    width:380px;

    padding:40px;

    background:white;

    border-radius:24px;

    box-shadow:
    0 10px 40px #8bc8ff55;

}


h1{

    text-align:center;

    color:#17466d;

}


input{

    width:100%;

    height:45px;

    margin-top:15px;

    padding:0 15px;

    border:

    1px solid #cce7ff;

    border-radius:12px;

    font-size:16px;

}


button{

    width:100%;

    height:45px;

    margin-top:25px;

    border:0;

    border-radius:12px;

    background:#4da9ff;

    color:white;

    font-size:16px;

    cursor:pointer;

}


button:hover{

    background:#278cff;

}


#msg{

    text-align:center;

    margin-top:15px;

    color:#666;

}


</style>

</head>


<body>


<div class="box">

<h1>
🐋 CyberWhale
</h1>


<input
id="account"
placeholder="邮箱或用户名">


<input
id="password"
type="password"
placeholder="密码">


<button onclick="login()">
登录
</button>


<div id="msg"></div>


</div>



<script>


const supabaseUrl="jxbxswghraiwucjnyhhh.supabase.co";

const supabaseKey="sb_publishable_g9aX_HIuZL6LBNM5RUxLYQ_gdi127En";


const client=supabase.createClient(

    supabaseUrl,

    supabaseKey

);



async function login(){


    let account=
    document.getElementById("account").value.trim();


    let password=
    document.getElementById("password").value;


    let msg=
    document.getElementById("msg");



    if(!account || !password){

        msg.innerHTML="请输入账号和密码";

        return;

    }



    let email=account;



    // 输入用户名

    if(!account.includes("@")){


        let {data,error}=await client

        .from("profile")

        .select("email")

        .eq("username",account)

        .single();



        if(error || !data){


            msg.innerHTML="用户名不存在";

            return;


        }


        email=data.email;


    }



    // Supabase 登录


    let {data,error}=await client.auth.signInWithPassword({

        email:email,

        password:password

    });



    if(error){


        msg.innerHTML="密码错误";


        return;


    }



    msg.innerHTML="登录成功";


    setTimeout(()=>{


        location.href="index.html";


    },800);



}



</script>


</body>


</html>
