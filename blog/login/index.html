<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Login - CyberWhale Blog</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(135deg,#eaf7ff,#d9f1ff);

    font-family:
    "Segoe UI",
    "Microsoft YaHei",
    sans-serif;

}



.login-box{

    width:380px;

    padding:40px;

    background:white;

    border-radius:25px;

    box-shadow:
    0 15px 40px rgba(0,120,220,.18);

}



.logo{

    text-align:center;

    font-size:28px;

    font-weight:700;

    color:#168bd2;

    margin-bottom:35px;

}



input{

    width:100%;

    height:45px;

    margin-bottom:15px;

    padding:0 15px;

    border:

    1px solid #d5e8f8;

    border-radius:12px;

    font-size:15px;

    outline:none;

}



input:focus{

    border-color:#168bd2;

}



button{

    width:100%;

    height:45px;

    border:none;

    border-radius:12px;

    background:#168bd2;

    color:white;

    font-size:16px;

    cursor:pointer;

}



button:hover{

    background:#0878bd;

}



#msg{

    text-align:center;

    margin-top:20px;

    color:#666;

}



.footer{

    margin-top:30px;

    text-align:center;

    color:#8aa;

    font-size:13px;

}


</style>


</head>



<body>


<div class="login-box">


<div class="logo">

🐋 CyberWhale Blog

</div>



<input id="account"
placeholder="邮箱 / 用户名">



<input id="password"
type="password"
placeholder="密码">



<button onclick="login()">

登录

</button>



<div id="msg"></div>



<div class="footer">

© 2026 CyberWhale

</div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const supabaseUrl="https://jxbxswghraiwucjnyhhh.supabase.co";

const supabaseKey="sb_publishable_g9aX_HIuZL6LBNM5RUxLYQ_gdi127En";


const client=supabase.createClient(
    supabaseUrl,
    supabaseKey
);



async function login(){


    let account=
    document.getElementById("account").value;


    let password=
    document.getElementById("password").value;


    let msg=
    document.getElementById("msg");



    if(!account||!password){

        msg.innerHTML="请输入账号和密码";

        return;

    }



    let email=account;



    // 用户名登录

    if(!account.includes("@")){


        let {data,error}=await client

        .from("profile")

        .select("email")

        .eq("username",account)

        .single();



        if(error||!data){


            msg.innerHTML="用户名不存在";


            return;

        }



        email=data.email;


    }



    // Supabase Auth登录


    let {data,error}=await client.auth

    .signInWithPassword({

        email:email,

        password:password

    });



    if(error){


        msg.innerHTML="密码错误";


        return;

    }



    msg.innerHTML="登录成功";


    setTimeout(()=>{


        location.href="index.html";


    },800);


}


</script>


</body>

</html>
