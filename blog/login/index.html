<script>

const supabaseUrl="https://jxbxswghraiwucjnyhhh.supabase.co";

const supabaseKey="sb_publishable_g9aX_HIuZL6LBNM5RUxLYQ_gdi127En";


const client=supabase.createClient(
    supabaseUrl,
    supabaseKey
);



async function login(){

    let account=document
        .getElementById("account")
        .value
        .trim();

    let password=document
        .getElementById("password")
        .value;


    let msg=document.getElementById("msg");


    if(!account || !password){

        msg.innerHTML="请输入账号和密码";

        return;

    }


    let email=account;



    // 用户名登录

    if(!account.includes("@")){


        let {data,error}=await client

            .from("profile")

            .select("email")

            .eq("username",account)

            .single();



        console.log("账号:",account);

        console.log("查询:",data,error);



        if(error || !data){

            msg.innerHTML="用户名不存在";

            return;

        }



        email=data.email;


    }



    // Supabase Auth 登录


    let {data,error}=await client.auth.signInWithPassword({

        email:email,

        password:password

    });



    console.log("登录:",data,error);



    if(error){

        msg.innerHTML="密码错误";

        return;

    }



    msg.innerHTML="登录成功";


    setTimeout(()=>{

        location.href="index.html";

    },800);


}

</script>
