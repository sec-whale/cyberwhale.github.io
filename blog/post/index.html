}

.comment-content p{

}

.comment-content ul,

}

.comment-content blockquote{
	margin:12px 0;
	padding:8px 15px;
	border-left:4px solid #4da9ff;

.comment-content code{

#commentInput{

<script>

const supabaseUrl=
"https://jxbxswghraiwucjnyhhh.supabase.co";

const supabaseKey=
"sb_publishable_g9aX_HIuZL6LBNM5RUxLYQ_gdi127En";

const client=
supabase.createClient(
	supabaseUrl,
	supabaseKey
);

let currentProfile=null;
let currentUser=null;
let currentPostId=null;

async function checkLogin(){

	const {data,error}=
	await client.auth.getSession();

	if(
		error ||
		!data.session
	){

		location.replace(
			"/blog/login/"
		);

		return false;
	}

	currentUser=
	data.session.user;

	const email=
	data.session.user.email;

	const {
		data:profile,
		error:profileError
	}=
	await client
	.from("profile")
	.select("*")
	.eq(
		"email",
		email
	)
	.single();

	if(
		profileError ||
		!profile
	){

		await client.auth.signOut();

		location.replace(
			"/blog/login/"
		);

		return false;
	}

	currentProfile=
	profile;

	document
	.getElementById(
		"username"
	)
	.innerText=
		profile.username ||
		email;

	if(
		profile.role==="admin"
		||
		profile.role==="writer"
	){

		document
		.getElementById(
			"adminButton"
		)
		.style.display=
		"inline-block";

	}

	return true;

}

function canRead(post){

	if(!currentProfile){
		return false;
	}

	if(
		currentProfile.role===
		"admin"
	){
		return true;
	}

	if(
		!Array.isArray(
			post.allowed_roles
		)
	){
		return false;
	}

	return post
	.allowed_roles
	.includes(
		currentProfile.role
	);

}

async function logout(){

	await client.auth.signOut();

	sessionStorage.clear();

	location.replace(
		"/blog/login/"
	);

}

async function changePassword(){

	const password=
	prompt(
		"请输入新密码"
	);

	if(password===null){
		return;
	}

	if(!password){

		alert(
			"密码不能为空"
		);

		return;
	}

	const password2=
	prompt(
		"请再次输入新密码"
	);

	if(password2===null){
		return;
	}

	if(
		password!==
		password2
	){

		alert(
			"两次输入的密码不一致"
		);

		return;
	}

	const {error}=
	await client.auth.updateUser({
		password:password
	});

	if(error){

		alert(
			"修改密码失败："+error.message
		);

		return;
	}

	alert(
		"密码修改成功"
	);

}

function backToList(){

	location.href=
	"/blog/";

}

function fixMarkdown(markdown){

	if(!markdown){
		return "";
	}

	return markdown
	.replace(
		/\r\n/g,
		"\n"
	)
	.replace(
		/\\n/g,
		"\n"
	);

}

function fixLinks(){

	const article=
	document.getElementById(
		"article"
	);

	article
	.querySelectorAll(
		"a"
	)
	.forEach(link=>{

		const href=
		link.getAttribute(
			"href"
		);

		if(!href){
			return;
		}

		if(
			href.startsWith(
				"http://"
			)
			||
			href.startsWith(
				"https://"
			)
		){

			link.target=
			"_blank";

			link.rel=
			"noopener noreferrer";

		}

	});

}

function fixImages(){

	const article=
	document.getElementById(
		"article"
	);

	article
	.querySelectorAll(
		"img"
	)
	.forEach(img=>{

		let src=
		img.getAttribute(
			"src"
		);

		if(!src){
			return;
		}

		src=
		src.trim();

		if(
			src.startsWith(
				"http://"
			)
			||
			src.startsWith(
				"https://"
			)
			||
			src.startsWith(
				"data:"
			)
			||
			src.startsWith(
				"blob:"
			)
			||
			src.startsWith(
				"/"
			)
		){

			return;
		}

		img.src=
			"/"+
			src.replace(
				/^\.?\//,
				""
			);

	});

}

function renderMath(){

	if(
		typeof renderMathInElement===
		"undefined"
	){

		setTimeout(
			renderMath,
			100
		);

		return;
	}

	const article=
	document.getElementById(
		"article"
	);

	renderMathInElement(
		article,
		{
			delimiters:[
				{
					left:"$$",
					right:"$$",
					display:true
				},
				{
					left:"\\[",
					right:"\\]",
					display:true
				},
				{
					left:"$",
					right:"$",
					display:false
				},
				{
					left:"\\(",
					right:"\\)",
					display:false
				}
			],

			throwOnError:false,

			ignoredTags:[
				"script",
				"noscript",
				"style",
				"textarea",
				"pre",
				"code"
			]
		}
	);

}

async function getVotes(commentId){

	const {
		data,
		error
	}=
	await client
	.from("comment_votes")
	.select("*")
	.eq(
		"comment_id",
		commentId
	);

	if(error){

		console.log(
			"点赞读取错误：",
			error
		);

		return {
			likes:0,
			dislikes:0,
			myVote:0
		};
	}

	let likes=0;
	let dislikes=0;
	let myVote=0;

	data.forEach(item=>{

		if(item.vote===1){
			likes++;
		}

		if(item.vote===-1){
			dislikes++;
		}

		if(
			currentUser &&
			item.user_id===currentUser.id
		){
			myVote=item.vote;
		}

	});

	return {
		likes,
		dislikes,
		myVote
	};

}

async function vote(commentId,value){

	const {
		data:oldVote,
		error:findError
	}=
	await client
	.from("comment_votes")
	.select("*")
	.eq(
		"comment_id",
		commentId
	)
	.eq(
		"user_id",
		currentUser.id
	)
	.maybeSingle();

	if(findError){

		console.log(
			"点赞查询错误：",
			findError
		);

		return;
	}

	if(!oldVote){

		const {error}=
		await client
		.from("comment_votes")
		.insert({
			comment_id:commentId,
			user_id:currentUser.id,
			vote:value
		});

		if(error){

			console.log(
				"点赞失败：",
				error
			);

			return;
		}

	}else if(
		oldVote.vote===value
	){

		const {error}=
		await client
		.from("comment_votes")
		.delete()
		.eq(
			"id",
			oldVote.id
		);

		if(error){

			console.log(
				"取消点赞失败：",
				error
			);

			return;
		}

	}else{

		const {error}=
		await client
		.from("comment_votes")
		.update({
			vote:value
		})
		.eq(
			"id",
			oldVote.id
		);

		if(error){

			console.log(
				"切换点赞失败：",
				error
			);

			return;
		}

	}

	await loadComments();

}

async function loadComments(){

	const comments=
	document.getElementById(
		"comments"
	);

	const {
		data,
		error
	}=
	await client
	.from("comments")
	.select("*")
	.eq(
		"post_id",
		currentPostId
	)
	.order(
		"created_at",
		{
			ascending:true
		}
	);

	if(error){

		console.log(
			"评论读取错误：",
			error
		);

		comments.innerHTML=
		`
		<div class="comment-empty">
			评论加载失败
		</div>
		`;

		return;
	}

	comments.innerHTML="";

	if(data.length===0){

		comments.innerHTML=
		`
		<div class="comment-empty">
			还没有评论
		</div>
		`;

		return;
	}

	for(const item of data){

		const comment=
		document.createElement(
			"div"
		);

		comment.className=
		"comment";

		const top=
		document.createElement(
			"div"
		);

		top.className=
		"comment-top";

		const name=
		document.createElement(
			"span"
		);

		name.className=
		"comment-name";

		name.textContent=
		item.username;

		const time=
		document.createElement(
			"span"
		);

		time.className=
		"comment-time";

		time.textContent=
		new Date(
			item.created_at
		)
		.toLocaleString();

		top.appendChild(
			name
		);

		top.appendChild(
			time
		);

		const content=
		document.createElement(
			"div"
		);

		content.className=
		"comment-content";

		const markdown=
		fixMarkdown(
			item.content
		);

		const html=
		marked.parse(
			markdown
		);

		content.innerHTML=
		DOMPurify.sanitize(
			html
		);

		const votes=
		await getVotes(
			item.id
		);

		const actions=
		document.createElement(
			"div"
		);

		actions.className=
		"comment-actions";

		const like=
		document.createElement(
			"button"
		);

		like.className=
		"vote-button";

		if(votes.myVote===1){
			like.classList.add(
				"active"
			);
		}

		like.textContent=
		"👍 "+votes.likes;

		like.onclick=
		()=>{
			vote(
				item.id,
				1
			);
		};

		const dislike=
		document.createElement(
			"button"
		);

		dislike.className=
		"vote-button";

		if(votes.myVote===-1){
			dislike.classList.add(
				"active"
			);
		}

		dislike.textContent=
		"👎 "+votes.dislikes;

		dislike.onclick=
		()=>{
			vote(
				item.id,
				-1
			);
		};

		actions.appendChild(
			like
		);

		actions.appendChild(
			dislike
		);

		comment.appendChild(
			top
		);

		comment.appendChild(
			content
		);

		comment.appendChild(
			actions
		);

		comments.appendChild(
			comment
		);

	}

}

async function sendComment(){

	const input=
	document.getElementById(
		"commentInput"
	);

	const content=
	input.value.trim();

	if(!content){

		alert(
			"评论不能为空"
		);

		return;
	}

	const username=
	currentProfile.username ||
	currentUser.email;

	const {error}=
	await client
	.from("comments")
	.insert({
		post_id:currentPostId,
		user_id:currentUser.id,
		username:username,
		content:content
	});

	if(error){

		console.log(
			"评论发送错误：",
			error
		);

		alert(
			"评论发送失败"
		);

		return;
	}

	input.value="";

	await loadComments();

}

async function loadPost(){

	const params=
	new URLSearchParams(
		location.search
	);

	const id=
	params.get(
		"id"
	);

	const article=
	document.getElementById(
		"article"
	);

	if(!id){

		article.innerHTML=
		`
		<div
		class="status"
		id="error">
			没有指定文章
		</div>
		`;

		return;
	}

	const {
		data,
		error
	}=
	await client
	.from("posts")
	.select("*")
	.eq(
		"id",
		id
	)
	.maybeSingle();

	if(
		error ||
		!data
	){

		console.log(
			"文章读取错误：",
			error
		);

		article.innerHTML=
		`
		<div
		class="status"
		id="error">
			文章不存在或你没有查看权限
		</div>
		`;

		return;
	}

	if(
		!canRead(data)
	){

		article.innerHTML=
		`
		<div
		class="status"
		id="error">
			你没有权限查看这篇文章
		</div>
		`;

		return;
	}

	if(!data.file){

		article.innerHTML=
		`
		<div
		class="status"
		id="error">
			文章内容为空
		</div>
		`;

		return;
	}

	let markdown=
	fixMarkdown(
		data.file
	);

	currentPostId=
	id;

	document.title=
		(data.title || "文章")
		+
		" - CyberWhale Blog";

	article.innerHTML=
		`
		<div class="post-meta">
			${data.author || "CyberWhale"}
			·
			${data.date || ""}
			·
			${data.category || ""}
		</div>

		${marked.parse(markdown)}
		`;

	fixLinks();

	fixImages();

	renderMath();

	document
	.getElementById(
		"commentsBox"
	)
	.style.display=
	"block";

	await loadComments();

}

document
.getElementById(
	"adminButton"
)
.onclick=
()=>{

	location.href=
	"/blog/admin/";

};

document
.getElementById(
	"changePassword"
)
.onclick=
changePassword;

document
.getElementById(
	"logout"
)
.onclick=
logout;

document
.getElementById(
	"sendComment"
)
.onclick=
sendComment;

async function start(){

	const logged=
	await checkLogin();

	if(!logged){
		return;
	}

	await loadPost();

}

start();

</script>
