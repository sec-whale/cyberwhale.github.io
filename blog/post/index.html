<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CyberWhale Blog</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

*{
	margin:0;
	padding:0;
	box-sizing:border-box;
}

body{
	font-family:
	Inter,
	"Segoe UI",
	"Microsoft YaHei",
	sans-serif;
	background:linear-gradient(135deg,#f8fcff,#dff3ff);
	color:#16324a;
	min-height:100vh;
}

header{
	height:75px;
	display:flex;
	align-items:center;
	justify-content:space-between;
	padding:0 70px;
	background:rgba(255,255,255,.75);
	backdrop-filter:blur(20px);
	border-bottom:1px solid #d9edff;
}

.logo{
	font-size:26px;
	font-weight:700;
}

.logo span{
	color:#168bd2;
}

nav{
	display:flex;
	align-items:center;
}

nav a{
	margin-left:30px;
	text-decoration:none;
	color:#5c7890;
}

nav a:hover{
	color:#168bd2;
}

.user-menu{
	margin-left:30px;
	display:flex;
	align-items:center;
}

.menu-item{
	padding:0 18px;
	border-left:1px solid #d7e8f3;
	color:#5c7890;
	cursor:pointer;
	white-space:nowrap;
}

.menu-item:first-child{
	border-left:0;
}

.menu-item:hover{
	color:#168bd2;
}

#adminButton{
	display:none;
	color:#168bd2;
}

#username{
	color:#48687f;
	cursor:default;
}

#username:hover{
	color:#48687f;
}

#changePassword,
#logout{
	color:#168bd2;
}

.container{
	width:85%;
	max-width:1000px;
	margin:45px auto;
}

.back{
	display:inline-block;
	margin-bottom:20px;
	padding:10px 18px;
	border-radius:14px;
	background:rgba(255,255,255,.8);
	box-shadow:0 6px 20px rgba(0,120,200,.1);
	color:#168bd2;
	cursor:pointer;
}

.back:hover{
	background:#e4f4ff;
}

.article{
	padding:38px 45px;
	background:rgba(255,255,255,.82);
	backdrop-filter:blur(20px);
	border-radius:25px;
	box-shadow:0 10px 30px rgba(0,120,200,.12);
	line-height:1.8;
	min-height:300px;
	overflow-wrap:anywhere;
}

.article h1{
	font-size:34px;
	margin:5px 0 25px;
	color:#16324a;
}

.article h2{
	font-size:27px;
	margin:35px 0 15px;
	color:#17466d;
}

.article h3{
	font-size:22px;
	margin:28px 0 12px;
	color:#17466d;
}

.article h4{
	font-size:19px;
	margin:24px 0 10px;
	color:#17466d;
}

.article p{
	margin:14px 0;
	color:#455f73;
}

.article strong{
	color:#294c67;
}

.article a{
	color:#168bd2;
	text-decoration:none;
}

.article a:hover{
	text-decoration:underline;
}

.article ul,
.article ol{
	margin:15px 0 15px 30px;
}

.article li{
	margin:6px 0;
}

.article blockquote{
	margin:20px 0;
	padding:12px 20px;
	border-left:4px solid #4da9ff;
	background:#edf8ff;
	border-radius:0 12px 12px 0;
	color:#58758d;
}

.article code{
	font-family:
	Consolas,
	"Courier New",
	monospace;
	background:#eef6fb;
	padding:2px 6px;
	border-radius:6px;
}

.article pre{
	margin:20px 0;
	padding:20px;
	overflow:auto;
	background:#102635;
	border-radius:15px;
}

.article pre code{
	background:transparent;
	padding:0;
	color:#eef8ff;
	line-height:1.6;
}

.article img{
	display:block;
	max-width:100%;
	margin:20px auto;
	border-radius:15px;
}

.article hr{
	border:0;
	height:1px;
	background:#d4eafb;
	margin:30px 0;
}

.article table{
	width:100%;
	border-collapse:collapse;
	margin:20px 0;
}

.article th,
.article td{
	padding:10px 14px;
	border:1px solid #cfe6f6;
	text-align:left;
}

.article th{
	background:#e8f5ff;
}

.status{
	text-align:center;
	padding:60px 20px;
	color:#789;
}

#error{
	color:#d9534f;
}

.post-meta{
	margin-bottom:25px;
	padding-bottom:18px;
	border-bottom:1px solid #dcecf6;
	color:#8aa0b1;
	font-size:14px;
}

footer{
	text-align:center;
	padding:35px;
	color:#789;
}

@media(max-width:900px){

	header{
		padding:0 25px;
	}

	nav>a{
		display:none;
	}

	.menu-item{
		padding:0 8px;
		font-size:14px;
	}

	.user-menu{
		margin-left:0;
	}

	.container{
		width:90%;
	}

	.article{
		padding:28px 22px;
	}

}

</style>

</head>

<body>

<header>

<div class="logo">
🐋 Cyber<span>Whale</span> Blog
</div>

<nav>

<a href="/blog/">
Home
</a>

<a href="#">
Projects
</a>

<a href="#">
About
</a>

<div class="user-menu">

<span
class="menu-item"
id="adminButton">
管理
</span>

<span
class="menu-item"
id="username">
...
</span>

<span
class="menu-item"
id="changePassword">
改密码
</span>

<span
class="menu-item"
id="logout">
登出
</span>

</div>

</nav>

</header>

<div class="container">

<div
class="back"
onclick="backToList()">
← 返回文章列表
</div>

<article
class="article"
id="article">

<div class="status">
正在加载文章...
</div>

</article>

</div>

<footer>
© 2026 CyberWhale
</footer>

<script>

const supabaseUrl=
"https://jxbxswghraiwucjnyhhh.supabase.co";

const supabaseKey=
"sb_publishable_g9aX_HIuZL6LBNM5RUxLYQ_gdi127En";

const client=
supabase.createClient(
	supabaseUrl,
	supabaseKey
);

let currentProfile=null;

async function checkLogin(){

	const {data,error}=
	await client.auth.getSession();

	if(
		error ||
		!data.session
	){

		location.replace(
			"/blog/login/"
		);

		return false;
	}

	const email=
	data.session.user.email;

	const {
		data:profile,
		error:profileError
	}=
	await client
	.from("profile")
	.select("*")
	.eq(
		"email",
		email
	)
	.single();

	if(
		profileError ||
		!profile
	){

		await client.auth.signOut();

		location.replace(
			"/blog/login/"
		);

		return false;
	}

	currentProfile=
	profile;

	document
	.getElementById(
		"username"
	)
	.innerText=
		profile.username ||
		email;

	if(
		profile.role===
		"admin"
	){

		document
		.getElementById(
			"adminButton"
		)
		.style.display=
		"inline-block";

	}

	return true;

}

function canRead(post){

	if(!currentProfile){
		return false;
	}

	if(
		currentProfile.role===
		"admin"
	){
		return true;
	}

	if(
		!Array.isArray(
			post.allowed_roles
		)
	){
		return false;
	}

	return post
	.allowed_roles
	.includes(
		currentProfile.role
	);

}

async function logout(){

	await client.auth.signOut();

	sessionStorage.clear();

	location.replace(
		"/blog/login/"
	);

}

async function changePassword(){

	const password=
	prompt(
		"请输入新密码"
	);

	if(password===null){
		return;
	}

	if(!password){

		alert(
			"密码不能为空"
		);

		return;
	}

	const password2=
	prompt(
		"请再次输入新密码"
	);

	if(password2===null){
		return;
	}

	if(
		password!==
		password2
	){

		alert(
			"两次输入的密码不一致"
		);

		return;
	}

	const {error}=
	await client.auth.updateUser({
		password:password
	});

	if(error){

		alert(
			"修改密码失败："+error.message
		);

		return;
	}

	alert(
		"密码修改成功"
	);

}

function backToList(){

	location.href=
	"/blog/";

}

function fixMarkdown(markdown){

	if(!markdown){
		return "";
	}

	return markdown
	.replace(
		/\r\n/g,
		"\n"
	)
	.replace(
		/\\n/g,
		"\n"
	);

}

async function loadPost(){

	const params=
	new URLSearchParams(
		location.search
	);

	const id=
	params.get(
		"id"
	);

	const article=
	document.getElementById(
		"article"
	);

	if(!id){

		article.innerHTML=
		`
		<div
		class="status"
		id="error">
			没有指定文章
		</div>
		`;

		return;
	}

	const {data,error}=
	await client
	.from("posts")
	.select("*")
	.eq(
		"id",
		id
	)
	.maybeSingle();

	if(
		error ||
		!data
	){

		console.log(
			"文章读取错误：",
			error
		);

		article.innerHTML=
		`
		<div
		class="status"
		id="error">
			文章不存在或你没有查看权限
		</div>
		`;

		return;
	}

	if(
		!canRead(data)
	){

		article.innerHTML=
		`
		<div
		class="status"
		id="error">
			你没有权限查看这篇文章
		</div>
		`;

		return;
	}

	if(!data.file){

		article.innerHTML=
		`
		<div
		class="status"
		id="error">
			文章内容为空
		</div>
		`;

		return;
	}

	let markdown=
	fixMarkdown(
		data.file
	);

	document.title=
		(data.title || "文章")
		+
		" - CyberWhale Blog";

	article.innerHTML=
		`
		<div class="post-meta">
			${data.author || "CyberWhale"}
			·
			${data.date || ""}
			·
			${data.category || ""}
		</div>

		${marked.parse(markdown)}
		`;

}

document
.getElementById(
	"adminButton"
)
.onclick=
()=>{

	location.href=
	"/blog/admin/";

};

document
.getElementById(
	"changePassword"
)
.onclick=
changePassword;

document
.getElementById(
	"logout"
)
.onclick=
logout;

async function start(){

	const logged=
	await checkLogin();

	if(!logged){
		return;
	}

	await loadPost();

}

start();

</script>

</body>

</html>
