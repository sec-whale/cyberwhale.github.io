<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>文章标题</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

<style>
body{
	max-width:900px;
	margin:40px auto;
	padding:0 20px;
	font-family:Arial,sans-serif;
	line-height:1.7;
}
article{
	margin-bottom:50px;
}
.comment-box{
	margin-top:40px;
	padding-top:25px;
	border-top:1px solid #ddd;
}
.comment{
	padding:16px 0;
	border-bottom:1px solid #eee;
}
.comment-top{
	display:flex;
	align-items:center;
	gap:10px;
	margin-bottom:8px;
}
.comment-name{
	font-weight:bold;
}
.comment-time{
	font-size:13px;
	color:#888;
}
.comment-content{
	line-height:1.7;
}
.comment-content p{
	margin:6px 0;
}
.comment-content pre{
	padding:12px;
	background:#f5f5f5;
	border-radius:6px;
	overflow:auto;
}
.comment-content code{
	font-family:Consolas,monospace;
}
.comment-actions{
	display:flex;
	gap:8px;
	margin-top:10px;
}
.vote-btn{
	border:1px solid #ddd;
	background:white;
	border-radius:8px;
	padding:5px 10px;
	cursor:pointer;
}
.vote-btn:hover{
	background:#f5f5f5;
}
.vote-btn.active{
	font-weight:bold;
	background:#eee;
}
#commentInput{
	width:100%;
	height:120px;
	padding:12px;
	box-sizing:border-box;
	resize:vertical;
	font-size:15px;
	border:1px solid #ccc;
	border-radius:8px;
}
#sendComment{
	margin-top:10px;
	padding:8px 18px;
	border:1px solid #ccc;
	background:white;
	border-radius:8px;
	cursor:pointer;
}
#sendComment:hover{
	background:#f5f5f5;
}
</style>
</head>

<body>

<article>
	<h1>文章标题</h1>

	<p>
		这里放你的文章正文。
	</p>
</article>

<div class="comment-box">

	<h2>评论</h2>

	<div id="comments">
		正在加载评论...
	</div>

	<h3>发表评论</h3>

	<textarea id="commentInput" placeholder="支持 Markdown"></textarea>

	<br>

	<button id="sendComment">发送评论</button>

</div>

<script>
const SUPABASE_URL="jxbxswghraiwucjnyhhh.supabase.co";
const SUPABASE_KEY="sb_publishable_g9aX_HIuZL6LBNM5RUxLYQ_gdi127En";

const client=supabase.createClient(
	SUPABASE_URL,
	SUPABASE_KEY
);

const postId="post-001";

let currentUser=null;

async function getVotes(commentId){
	const {data,error}=await client
		.from("comment_votes")
		.select("*")
		.eq("comment_id",commentId);

	if(error){
		console.log(error);
		return {
			likes:0,
			dislikes:0,
			myVote:0
		};
	}

	let likes=0;
	let dislikes=0;
	let myVote=0;

	data.forEach(item=>{
		if(item.vote==1) likes++;
		else if(item.vote==-1) dislikes++;

		if(currentUser&&item.user_id==currentUser.id){
			myVote=item.vote;
		}
	});

	return {
		likes,
		dislikes,
		myVote
	};
}

async function vote(commentId,voteValue){
	if(!currentUser){
		alert("请先登录");
		return;
	}

	const {data:oldVote,error:findError}=await client
		.from("comment_votes")
		.select("*")
		.eq("comment_id",commentId)
		.eq("user_id",currentUser.id)
		.maybeSingle();

	if(findError){
		console.log(findError);
		return;
	}

	if(!oldVote){
		const {error}=await client
			.from("comment_votes")
			.insert({
				comment_id:commentId,
				user_id:currentUser.id,
				vote:voteValue
			});

		if(error){
			console.log(error);
			return;
		}
	}else if(oldVote.vote==voteValue){
		const {error}=await client
			.from("comment_votes")
			.delete()
			.eq("id",oldVote.id);

		if(error){
			console.log(error);
			return;
		}
	}else{
		const {error}=await client
			.from("comment_votes")
			.update({
				vote:voteValue
			})
			.eq("id",oldVote.id);

		if(error){
			console.log(error);
			return;
		}
	}

	await loadComments();
}

async function loadComments(){
	const box=document.getElementById("comments");

	const {data,error}=await client
		.from("comments")
		.select("*")
		.eq("post_id",postId)
		.order("created_at",{ascending:true});

	if(error){
		console.log(error);
		box.innerHTML="评论加载失败";
		return;
	}

	box.innerHTML="";

	if(data.length==0){
		box.innerHTML="<p>还没有评论。</p>";
		return;
	}

	for(const item of data){
		const div=document.createElement("div");
		div.className="comment";

		const top=document.createElement("div");
		top.className="comment-top";

		const name=document.createElement("span");
		name.className="comment-name";
		name.textContent=item.username;

		const time=document.createElement("span");
		time.className="comment-time";
		time.textContent=new Date(item.created_at).toLocaleString();

		top.appendChild(name);
		top.appendChild(time);

		const content=document.createElement("div");
		content.className="comment-content";

		const html=marked.parse(item.content);
		content.innerHTML=DOMPurify.sanitize(html);

		const votes=await getVotes(item.id);

		const actions=document.createElement("div");
		actions.className="comment-actions";

		const likeBtn=document.createElement("button");
		likeBtn.className="vote-btn";

		if(votes.myVote==1){
			likeBtn.classList.add("active");
		}

		likeBtn.textContent="👍 "+votes.likes;

		likeBtn.onclick=()=>{
			vote(item.id,1);
		};

		const dislikeBtn=document.createElement("button");
		dislikeBtn.className="vote-btn";

		if(votes.myVote==-1){
			dislikeBtn.classList.add("active");
		}

		dislikeBtn.textContent="👎 "+votes.dislikes;

		dislikeBtn.onclick=()=>{
			vote(item.id,-1);
		};

		actions.appendChild(likeBtn);
		actions.appendChild(dislikeBtn);

		div.appendChild(top);
		div.appendChild(content);
		div.appendChild(actions);

		box.appendChild(div);
	}
}

document.getElementById("sendComment").onclick=async()=>{
	const input=document.getElementById("commentInput");
	const content=input.value.trim();

	if(content==""){
		alert("评论不能为空");
		return;
	}

	if(!currentUser){
		alert("请先登录");
		location.href="/login/";
		return;
	}

	const username=
		currentUser.user_metadata?.username||
		currentUser.user_metadata?.name||
		currentUser.email;

	const {error}=await client
		.from("comments")
		.insert({
			post_id:postId,
			user_id:currentUser.id,
			username:username,
			content:content
		});

	if(error){
		console.log(error);
		alert("评论发送失败");
		return;
	}

	input.value="";

	await loadComments();
}

async function init(){
	const {data:{session}}=await client.auth.getSession();

	if(!session){
		location.href="/login/";
		return;
	}

	currentUser=session.user;

	await loadComments();
}

init();
</script>

</body>
</html>
