<script>

const supabaseUrl=
"https://jxbxswghraiwucjnyhhh.supabase.co";

const supabaseKey=
"sb_publishable_g9aX_HIuZL6LBNM5RUxLYQ_gdi127En";

const client=
supabase.createClient(
	supabaseUrl,
	supabaseKey
);

let currentProfile=null;
let currentUser=null;
let currentPostId=null;

async function checkLogin(){

	const {data,error}=
	await client.auth.getSession();

	if(
		error ||
		!data.session
	){

		location.replace(
			"/blog/login/"
		);

		return false;
	}

	currentUser=
	data.session.user;

	const email=
	currentUser.email;

	const {
		data:profile,
		error:profileError
	}=
	await client
	.from("profile")
	.select("*")
	.eq(
		"email",
		email
	)
	.single();

	if(
		profileError ||
		!profile
	){

		await client.auth.signOut();

		location.replace(
			"/blog/login/"
		);

		return false;
	}

	currentProfile=
	profile;

	document
	.getElementById(
		"username"
	)
	.innerText=
	profile.username ||
	email;

	if(
		profile.role==="admin"
		||
		profile.role==="writer"
	){

		document
		.getElementById(
			"adminButton"
		)
		.style.display=
		"inline-block";

	}

	return true;

}

function canRead(post){

	if(!currentProfile){
		return false;
	}

	if(
		currentProfile.role==="admin"
	){
		return true;
	}

	if(
		!Array.isArray(
			post.allowed_roles
		)
	){
		return false;
	}

	return post
	.allowed_roles
	.includes(
		currentProfile.role
	);

}

async function logout(){

	await client.auth.signOut();

	sessionStorage.clear();

	location.replace(
		"/blog/login/"
	);

}

async function changePassword(){

	const password=
	prompt(
		"请输入新密码"
	);

	if(password===null){
		return;
	}

	if(!password){

		alert(
			"密码不能为空"
		);

		return;
	}

	const password2=
	prompt(
		"请再次输入新密码"
	);

	if(password2===null){
		return;
	}

	if(password!==password2){

		alert(
			"两次输入的密码不一致"
		);

		return;
	}

	const {error}=
	await client.auth.updateUser({
		password:password
	});

	if(error){

		alert(
			"修改密码失败："+error.message
		);

		return;
	}

	alert(
		"密码修改成功"
	);

}

function backToList(){

	location.href=
	"/blog/";

}

function fixMarkdown(markdown){

	if(!markdown){
		return "";
	}

	return markdown
	.replace(
		/\r\n/g,
		"\n"
	)
	.replace(
		/\\n/g,
		"\n"
	);

}

function fixLinks(){

	const article=
	document.getElementById(
		"article"
	);

	article
	.querySelectorAll(
		"a"
	)
	.forEach(link=>{

		const href=
		link.getAttribute(
			"href"
		);

		if(!href){
			return;
		}

		if(
			href.startsWith("http://")
			||
			href.startsWith("https://")
		){

			link.target="_blank";
			link.rel="noopener noreferrer";

		}

	});

}

function fixImages(){

	const article=
	document.getElementById(
		"article"
	);

	article
	.querySelectorAll(
		"img"
	)
	.forEach(img=>{

		let src=
		img.getAttribute(
			"src"
		);

		if(!src){
			return;
		}

		src=src.trim();

		if(
			src.startsWith("http://")
			||
			src.startsWith("https://")
			||
			src.startsWith("data:")
			||
			src.startsWith("blob:")
			||
			src.startsWith("/")
		){

			return;
		}

		img.src=
		"/"+
		src.replace(
			/^\.?\//,
			""
		);

	});

}

function renderMath(){

	if(
		typeof renderMathInElement===
		"undefined"
	){

		setTimeout(
			renderMath,
			100
		);

		return;
	}

	const article=
	document.getElementById(
		"article"
	);

	renderMathInElement(
		article,
		{
			delimiters:[
				{
					left:"$$",
					right:"$$",
					display:true
				},
				{
					left:"\\[",
					right:"\\]",
					display:true
				},
				{
					left:"$",
					right:"$",
					display:false
				},
				{
					left:"\\(",
					right:"\\)",
					display:false
				}
			],

			throwOnError:false,

			ignoredTags:[
				"script",
				"noscript",
				"style",
				"textarea",
				"pre",
				"code"
			]
		}
	);

}

async function loadPostVotes(){

	const {
		data,
		error
	}=
	await client
	.from("post_votes")
	.select("*")
	.eq(
		"post_id",
		currentPostId
	);

	if(error){

		console.log(
			"文章赞踩读取失败：",
			error
		);

		return;
	}

	let likes=0;
	let dislikes=0;
	let myVote=0;

	data.forEach(item=>{

		if(item.vote===1){
			likes++;
		}else if(item.vote===-1){
			dislikes++;
		}

		if(
			item.user_id===
			currentUser.id
		){
			myVote=item.vote;
		}

	});

	document
	.getElementById(
		"likeCount"
	)
	.innerText=
	likes;

	document
	.getElementById(
		"dislikeCount"
	)
	.innerText=
	dislikes;

	document
	.getElementById(
		"likePost"
	)
	.classList
	.toggle(
		"active",
		myVote===1
	);

	document
	.getElementById(
		"dislikePost"
	)
	.classList
	.toggle(
		"active",
		myVote===-1
	);

}

async function votePost(value){

	const {
		data:oldVote,
		error
	}=
	await client
	.from("post_votes")
	.select("*")
	.eq(
		"post_id",
		currentPostId
	)
	.eq(
		"user_id",
		currentUser.id
	)
	.maybeSingle();

	if(error){

		alert(
			"操作失败："+error.message
		);

		return;
	}

	if(!oldVote){

		const {error}=
		await client
		.from("post_votes")
		.insert({
			post_id:currentPostId,
			user_id:currentUser.id,
			vote:value
		});

		if(error){

			alert(
				"操作失败："+error.message
			);

			return;
		}

	}else if(
		oldVote.vote===value
	){

		const {error}=
		await client
		.from("post_votes")
		.delete()
		.eq(
			"id",
			oldVote.id
		);

		if(error){

			alert(
				"操作失败："+error.message
			);

			return;
		}

	}else{

		const {error}=
		await client
		.from("post_votes")
		.update({
			vote:value
		})
		.eq(
			"id",
			oldVote.id
		);

		if(error){

			alert(
				"操作失败："+error.message
			);

			return;
		}

	}

	await loadPostVotes();

}

async function editComment(id,oldContent){

	const content=
	prompt(
		"修改评论",
		oldContent
	);

	if(content===null){
		return;
	}

	if(!content.trim()){

		alert(
			"评论不能为空"
		);

		return;
	}

	const {error}=
	await client
	.from("comments")
	.update({
		content:content.trim()
	})
	.eq(
		"id",
		id
	);

	if(error){

		alert(
			"修改失败："+error.message
		);

		return;
	}

	await loadComments();

}

async function deleteComment(id){

	if(
		!confirm(
			"确定删除这条评论吗？"
		)
	){
		return;
	}

	const {error}=
	await client
	.from("comments")
	.delete()
	.eq(
		"id",
		id
	);

	if(error){

		alert(
			"删除失败："+error.message
		);

		return;
	}

	await loadComments();

}

async function loadComments(){

	const comments=
	document.getElementById(
		"comments"
	);

	const {
		data,
		error
	}=
	await client
	.from("comments")
	.select("*")
	.eq(
		"post_id",
		currentPostId
	)
	.order(
		"created_at",
		{
			ascending:true
		}
	);

	if(error){

		comments.innerHTML=
		`
		<div class="comment-empty">
		评论加载失败：${error.message}
		</div>
		`;

		return;
	}

	comments.innerHTML="";

	if(data.length===0){

		comments.innerHTML=
		`
		<div class="comment-empty">
		还没有评论
		</div>
		`;

		return;
	}

	data.forEach(item=>{

		const comment=
		document.createElement(
			"div"
		);

		comment.className=
		"comment";

		const top=
		document.createElement(
			"div"
		);

		top.className=
		"comment-top";

		const name=
		document.createElement(
			"span"
		);

		name.className=
		"comment-name";

		name.textContent=
		item.username;

		const time=
		document.createElement(
			"span"
		);

		time.className=
		"comment-time";

		time.textContent=
		new Date(
			item.created_at
		)
		.toLocaleString();

		top.appendChild(
			name
		);

		top.appendChild(
			time
		);

		if(
			currentProfile.role==="admin"
			||
			item.user_id===
			currentUser.id
		){

			const tools=
			document.createElement(
				"div"
			);

			tools.className=
			"comment-tools";

			const edit=
			document.createElement(
				"button"
			);

			edit.className=
			"edit-comment";

			edit.textContent=
			"修改";

			edit.onclick=
			()=>{
				editComment(
					item.id,
					item.content
				);
			};

			const del=
			document.createElement(
				"button"
			);

			del.className=
			"delete-comment";

			del.textContent=
			"删除";

			del.onclick=
			()=>{
				deleteComment(
					item.id
				);
			};

			tools.appendChild(
				edit
			);

			tools.appendChild(
				del
			);

			top.appendChild(
				tools
			);

		}

		const content=
		document.createElement(
			"div"
		);

		content.className=
		"comment-content";

		const markdown=
		fixMarkdown(
			item.content
		);

		content.innerHTML=
		DOMPurify.sanitize(
			marked.parse(
				markdown
			)
		);

		comment.appendChild(
			top
		);

		comment.appendChild(
			content
		);

		comments.appendChild(
			comment
		);

	});

}

async function sendComment(){

	const input=
	document.getElementById(
		"commentInput"
	);

	const content=
	input.value.trim();

	if(!content){

		alert(
			"评论不能为空"
		);

		return;
	}

	const username=
	currentProfile.username ||
	currentUser.email;

	const {error}=
	await client
	.from("comments")
	.insert({
		post_id:currentPostId,
		user_id:currentUser.id,
		username:username,
		content:content
	});

	if(error){

		alert(
			"评论发送失败："+error.message
		);

		return;
	}

	input.value="";

	await loadComments();

}

async function loadPost(){

	const params=
	new URLSearchParams(
		location.search
	);

	const id=
	params.get(
		"id"
	);

	const article=
	document.getElementById(
		"article"
	);

	if(!id){

		article.innerHTML=
		`
		<div
		class="status"
		id="error">
		没有指定文章
		</div>
		`;

		return;
	}

	const {
		data,
		error
	}=
	await client
	.from("posts")
	.select("*")
	.eq(
		"id",
		id
	)
	.maybeSingle();

	if(
		error ||
		!data
	){

		article.innerHTML=
		`
		<div
		class="status"
		id="error">
		文章不存在或你没有查看权限
		</div>
		`;

		return;
	}

	if(!canRead(data)){

		article.innerHTML=
		`
		<div
		class="status"
		id="error">
		你没有权限查看这篇文章
		</div>
		`;

		return;
	}

	if(!data.file){

		article.innerHTML=
		`
		<div
		class="status"
		id="error">
		文章内容为空
		</div>
		`;

		return;
	}

	const markdown=
	fixMarkdown(
		data.file
	);

	currentPostId=
	String(id);

	document.title=
	(data.title || "文章")
	+
	" - CyberWhale Blog";

	article.innerHTML=
	`
	<button
	class="copy-markdown"
	id="copyMarkdown">
	复制 Markdown
	</button>

	<div class="post-meta">
	${data.author || "CyberWhale"}
	·
	${data.date || ""}
	·
	${data.category || ""}
	</div>

	${marked.parse(markdown)}
	`;

	document
	.getElementById(
		"copyMarkdown"
	)
	.onclick=
	async()=>{

		await navigator
		.clipboard
		.writeText(
			markdown
		);

		const button=
		document.getElementById(
			"copyMarkdown"
		);

		button.innerText=
		"已复制";

		setTimeout(
			()=>{
				button.innerText=
				"复制 Markdown";
			},
			1200
		);

	};

	fixLinks();

	fixImages();

	renderMath();

	document
	.getElementById(
		"postVotes"
	)
	.style.display=
	"flex";

	document
	.getElementById(
		"commentsBox"
	)
	.style.display=
	"block";

	await loadPostVotes();

	await loadComments();

}

document
.getElementById(
	"adminButton"
)
.onclick=
()=>{

	location.href=
	"/admin/";

};

document
.getElementById(
	"changePassword"
)
.onclick=
changePassword;

document
.getElementById(
	"logout"
)
.onclick=
logout;

document
.getElementById(
	"sendComment"
)
.onclick=
sendComment;

document
.getElementById(
	"likePost"
)
.onclick=
()=>{

	votePost(1);

};

document
.getElementById(
	"dislikePost"
)
.onclick=
()=>{

	votePost(-1);

};

async function start(){

	const logged=
	await checkLogin();

	if(!logged){
		return;
	}

	await loadPost();

}

start();

</script>
