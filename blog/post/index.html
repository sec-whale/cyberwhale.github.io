<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CyberWhale Blog</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
	margin:0;
	padding:0;
	box-sizing:border-box;
}

body{
	font-family:
	Inter,
	"Segoe UI",
	"Microsoft YaHei",
	sans-serif;

	background:
	linear-gradient(135deg,#f8fcff,#dff3ff);

	color:#16324a;
	min-height:100vh;
}

/* 顶部 */

header{
	height:75px;
	display:flex;
	align-items:center;
	justify-content:space-between;
	padding:0 70px;

	background:
	rgba(255,255,255,.75);

	backdrop-filter:blur(20px);

	border-bottom:1px solid #d9edff;
}

.logo{
	font-size:26px;
	font-weight:700;
}

.logo span{
	color:#168bd2;
}

nav a{
	margin-left:30px;
	text-decoration:none;
	color:#5c7890;
}

nav a:hover{
	color:#168bd2;
}

#logout{
	margin-left:30px;
	color:#168bd2;
	cursor:pointer;
}

/* 页面 */

.container{
	width:85%;
	margin:45px auto;
	display:flex;
	gap:35px;
}

/* 左侧分类 */

.sidebar{
	width:240px;
	padding:30px;
	height:max-content;
	flex-shrink:0;

	background:
	rgba(255,255,255,.8);

	backdrop-filter:blur(20px);

	border-radius:25px;

	box-shadow:
	0 10px 30px rgba(0,120,200,.12);
}

.sidebar h2{
	margin-bottom:25px;
	font-size:22px;
}

.category{
	padding:14px 18px;
	margin-bottom:12px;
	border-radius:15px;
	color:#567;
	cursor:pointer;
	transition:.3s;
}

.category:hover,
.category.active{
	background:#e4f4ff;
	color:#1388cf;
}

/* 文章列表 */

.posts{
	flex:1;
	display:grid;
	grid-template-columns:
	repeat(auto-fill,minmax(260px,1fr));
	gap:18px;
	align-items:start;
	align-content:start;
}

.card{
	min-height:175px;
	padding:22px;

	background:
	rgba(255,255,255,.8);

	backdrop-filter:blur(20px);

	border-radius:24px;

	box-shadow:
	0 10px 30px rgba(0,120,200,.12);

	transition:.25s;
	cursor:pointer;
}

.card:hover{
	transform:translateY(-4px);
	background:
	rgba(255,255,255,.95);
}

.tag{
	display:inline-block;
	font-size:14px;
	color:#168bd2;
	margin-bottom:12px;
}

.card h2{
	font-size:24px;
	margin:0 0 12px;
}

.desc{
	color:#637f96;
	line-height:1.6;
	margin-bottom:15px;
}

.info{
	margin-top:15px;
	color:#91a7b8;
	font-size:14px;
}

.empty{
	grid-column:1/-1;
	padding:50px;
	text-align:center;
	color:#789;
}

footer{
	text-align:center;
	padding:35px;
	color:#789;
}

/* 手机 */

@media(max-width:900px){

	header{
		padding:0 25px;
	}

	.container{
		width:90%;
		flex-direction:column;
	}

	.sidebar{
		width:100%;
	}

	.posts{
		grid-template-columns:1fr;
	}

}

</style>

</head>

<body>

<header>

<div class="logo">
🐋 Cyber<span>Whale</span> Blog
</div>

<nav>

<a href="/blog/">
Home
</a>

<a href="#">
Projects
</a>

<a href="#">
About
</a>

<span id="logout">
登出
</span>

</nav>

</header>

<div class="container">

<aside class="sidebar">

<h2>
分类
</h2>

<div id="categories">

<div
class="category active"
data-category="all">
🐋 全部
</div>

</div>

</aside>

<section
class="posts"
id="posts">

<div class="empty">
正在加载文章...
</div>

</section>

</div>

<footer>
© 2026 CyberWhale
</footer>

<script>

const supabaseUrl =
"https://jxbxswghraiwucjnyhhh.supabase.co";

const supabaseKey =
"sb_publishable_g9aX_HIuZL6LBNM5RUxLYQ_gdi127En";

const client =
supabase.createClient(
	supabaseUrl,
	supabaseKey
);

let allPosts = [];

let currentCategory =
"all";

async function checkLogin(){

	const {data} =
	await client.auth.getSession();

	if(!data.session){

		location.replace(
			"https://cyberwhale.net/blog/login/"
		);

		return false;

	}

	return true;

}

async function logout(){

	await client.auth.signOut();

	sessionStorage.removeItem(
		"login"
	);

	sessionStorage.removeItem(
		"username"
	);

	location.replace(
		"https://cyberwhale.net/blog/login/"
	);

}

async function loadPosts(){

	const {data,error} =
	await client
	.from("posts")
	.select("*")
	.order(
		"date",
		{
			ascending:false
		}
	);

	if(error){

		console.log(
			"posts读取错误：",
			error
		);

		document
		.getElementById("posts")
		.innerHTML =
		`
		<div class="empty">
			文章读取失败
		</div>
		`;

		return;

	}

	allPosts =
	data || [];

	loadCategories();

	renderPosts();

}

function loadCategories(){

	let box =
	document
	.getElementById("categories");

	box.innerHTML =
	`
	<div
	class="category active"
	data-category="all">
	🐋 全部
	</div>
	`;

	let categories = [];

	allPosts.forEach(post=>{

		if(
			post.category
			&&
			!categories.includes(
				post.category
			)
		){

			categories.push(
				post.category
			);

		}

	});

	categories.forEach(category=>{

		let item =
		document.createElement(
			"div"
		);

		item.className =
		"category";

		item.dataset.category =
		category;

		item.innerText =
		category;

		box.appendChild(
			item
		);

	});

	bindCategories();

}

function bindCategories(){

	document
	.querySelectorAll(
		".category"
	)
	.forEach(item=>{

		item.onclick =
		()=>{

			document
			.querySelectorAll(
				".category"
			)
			.forEach(x=>
				x.classList.remove(
					"active"
				)
			);

			item
			.classList
			.add(
				"active"
			);

			currentCategory =
				item.dataset.category;

			renderPosts();

		};

	});

}

function renderPosts(){

	let box =
	document
	.getElementById("posts");

	box.innerHTML =
	"";

	let list =
	allPosts.filter(
		post =>
		currentCategory ===
		"all"
		||
		post.category ===
		currentCategory
	);

	if(list.length === 0){

		box.innerHTML =
		`
		<div class="empty">
			暂无文章
		</div>
		`;

		return;

	}

	list.forEach(post=>{

		let card =
		document.createElement(
			"div"
		);

		card.className =
		"card";

		card.innerHTML =
		`
		<div class="tag">
			${post.category || ""}
		</div>

		<h2>
			${post.title || ""}
		</h2>

		${post.desc ? `
		<p class="desc">
			${post.desc}
		</p>
		` : ""}

		<div class="info">
			CyberWhale · ${post.date || ""}
		</div>
		`;

		card.onclick =
		()=>{

			if(post.file){

				location.href =
					"/blog/post/?file=" +
					encodeURIComponent(
						post.file
					);

			}

		};

		box.appendChild(
			card
		);

	});

}

document
.getElementById(
	"logout"
)
.onclick =
logout;

async function start(){

	let logged =
	await checkLogin();

	if(!logged)
		return;

	await loadPosts();

}

start();

</script>

</body>

</html>
