<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CyberWhale Blog</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #e8f6ff,
        #cfeaff
    );

    font-family:
    "Microsoft YaHei",
    Arial;

}



.box{

    position:relative;

    width:900px;

    margin:60px auto;

    padding:40px;

    background:white;

    border-radius:24px;

    box-shadow:
    0 10px 40px #8bc8ff55;

}



h1{

    text-align:center;

    color:#17466d;

}



.user{

    text-align:center;

    color:#666;

    margin-top:15px;

}



.logout{

    position:absolute;

    top:25px;

    right:30px;

    padding:8px 18px;

    border:none;

    border-radius:10px;

    background:#4da9ff;

    color:white;

    cursor:pointer;

}


.logout:hover{

    background:#278cff;

}



.admin-btn{

    margin:10px;

    padding:10px 20px;

    border:none;

    border-radius:10px;

    background:#4da9ff;

    color:white;

    cursor:pointer;

}



.admin-btn:hover{

    background:#278cff;

}



.article{

    margin-top:30px;

    padding:20px;

    border-radius:15px;

    background:#f5faff;

}


</style>


</head>



<body>


<div class="box">


<button class="logout" onclick="logout()">
登出
</button>



<h1>
🐋 CyberWhale Blog
</h1>



<div class="user" id="user">
正在检查登录...
</div>




<div id="adminPanel" style="display:none;text-align:center;margin-top:20px;">


<button class="admin-btn" onclick="location.href='admin.html'">
管理用户
</button>


<button class="admin-btn" onclick="location.href='new.html'">
新建文章
</button>


</div>




<div class="article">

<h2>
欢迎来到 CyberWhale Blog
</h2>


<p>
这里以后用于发布题解、学习记录以及项目文章。
</p>


</div>



</div>





<script>


const supabaseUrl =
"https://jxbxswghraiwucjnyhhh.supabase.co";


const supabaseKey =
"sb_publishable_g9aX_HIuZL6LBNM5RUxLYQ_gdi127En";


const client =
supabase.createClient(
    supabaseUrl,
    supabaseKey
);





async function checkLogin(){


    const {data} =
    await client.auth.getSession();



    if(!data.session){


        location.href =
        "https://cyberwhale.net/login/";


        return;

    }



    let email =
    data.session.user.email;



    let result =
    await client
    .from("profile")
    .select("username,role")
    .eq("email",email)
    .limit(1);




    if(!result.data ||
       result.data.length===0){


        document
        .getElementById("user")
        .innerHTML =
        "当前用户：" + email;


        return;

    }




    let user =
    result.data[0];




    document
    .getElementById("user")
    .innerHTML =
    "当前用户：" + user.username;




    if(user.role=="admin"){


        document
        .getElementById("adminPanel")
        .style.display =
        "block";


    }


}




async function logout(){


    await client.auth.signOut();


    location.href =
    "https://cyberwhale.net/login/";

}




checkLogin();


</script>


</body>

</html>
