<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CyberWhale Blog</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:
    Inter,
    "Segoe UI",
    sans-serif;

    background:
    linear-gradient(135deg,#f8fcff,#dff3ff);

    color:#16324a;
}


/* 顶部 */

header{

    height:75px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 70px;

    background:
    rgba(255,255,255,.75);

    backdrop-filter:blur(20px);

    border-bottom:1px solid #d9edff;

}


.logo{

    font-size:26px;

    font-weight:700;

}


.logo span{

    color:#168bd2;

}



nav a{

    margin-left:30px;

    text-decoration:none;

    color:#5c7890;

}


nav a:hover{

    color:#168bd2;

}



/* 页面 */

.container{

    width:85%;

    margin:45px auto;

    display:flex;

    gap:35px;

}



/* 左侧 */

.sidebar{

    width:240px;

    padding:30px;

    height:max-content;


    background:
    rgba(255,255,255,.8);


    backdrop-filter:blur(20px);


    border-radius:25px;


    box-shadow:
    0 10px 30px rgba(0,120,200,.12);

}


.sidebar h2{

    margin-bottom:25px;

    font-size:22px;

}



.category{

    padding:14px 18px;

    margin-bottom:12px;

    border-radius:15px;

    color:#567;

    cursor:pointer;

    transition:.3s;

}


.category:hover,
.category.active{

    background:#e4f4ff;

    color:#1388cf;

}



/* 文章 */

.posts{

    flex:1;

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:25px;

}



.card{

    padding:30px;


    background:
    rgba(255,255,255,.8);


    backdrop-filter:blur(20px);


    border-radius:25px;


    box-shadow:
    0 10px 30px rgba(0,120,200,.12);


    transition:.3s;

}


.card:hover{

    transform:translateY(-8px);

}



.tag{

    color:#168bd2;

    font-size:14px;

}



.card h2{

    margin-top:15px;

    font-size:25px;

}



.desc{

    margin-top:15px;

    color:#637f96;

    line-height:1.6;

}



.info{

    margin-top:25px;

    color:#91a7b8;

    font-size:14px;

}



footer{

    text-align:center;

    padding:35px;

    color:#789;

}



@media(max-width:900px){

.container{

    flex-direction:column;

}

.sidebar{

    width:100%;

}

.posts{

    grid-template-columns:1fr;

}

}

</style>

</head>


<body>


<header>

<div class="logo">
🐋 Cyber<span>Whale</span> Blog
</div>


<nav>

<a href="#">Home</a>

<a href="#">Projects</a>

<a href="#">About</a>

</nav>


</header>



<div class="container">


<aside class="sidebar">


<h2>
分类
</h2>


<div class="category active">
🐋 全部
</div>


<div class="category">
📚 信息学
</div>


<div class="category">
💻 项目
</div>


<div class="category">
📝 其他
</div>



</aside>





<section class="posts">


<div class="card">

<div class="tag">
信息学
</div>


<h2>
1401 题解
</h2>


<p class="desc">
结构体 + 递归查找祖先。
</p>


<div class="info">
CyberWhale · 2026-08-11
</div>

</div>





<div class="card">


<div class="tag">
项目
</div>


<h2>
Whale Note 开发记录
</h2>


<p class="desc">
记录笔记软件开发过程。
</p>


<div class="info">
CyberWhale · 2026-08-11
</div>


</div>





<div class="card">


<div class="tag">
其他
</div>


<h2>
开发日志
</h2>


<p class="desc">
记录一些想法和实验。
</p>


<div class="info">
CyberWhale · 2026-08-11
</div>


</div>



</section>


</div>




<footer>

© 2026 CyberWhale

</footer>



</body>
</html>
