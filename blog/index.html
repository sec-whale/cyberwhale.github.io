<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CyberWhale Blog</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:
    Inter,
    "Segoe UI",
    Arial,
    sans-serif;

    background:
    linear-gradient(135deg,#f8fcff,#dff3ff);

    color:#17324d;
}


/* 顶部 */

header{

    height:75px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 70px;

    background:
    rgba(255,255,255,.75);

    backdrop-filter:blur(20px);

    border-bottom:1px solid #d8edff;

}


.logo{

    font-size:26px;

    font-weight:700;

}


.logo span{

    color:#1596dc;

}


nav a{

    text-decoration:none;

    color:#567389;

    margin-left:30px;

}


nav a:hover{

    color:#1596dc;

}




/* 主体 */

.container{

    width:85%;

    margin:45px auto;

    display:flex;

    gap:35px;

}



/* 分类栏 */

.sidebar{

    width:240px;

    height:max-content;

    padding:30px;


    background:
    rgba(255,255,255,.8);


    backdrop-filter:blur(20px);


    border-radius:25px;


    box-shadow:
    0 10px 30px rgba(0,120,200,.12);

}


.sidebar h2{

    margin-bottom:25px;

}



.category{

    padding:14px 18px;

    margin-bottom:12px;

    border-radius:15px;


    cursor:pointer;

    color:#567389;

    transition:.3s;

}



.category:hover,
.category.active{

    background:#e4f4ff;

    color:#1388cf;

}



/* 文章 */

.posts{

    flex:1;

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:25px;

}



.card{

    padding:30px;


    background:
    rgba(255,255,255,.8);


    backdrop-filter:blur(20px);


    border-radius:25px;


    box-shadow:
    0 10px 30px rgba(0,120,200,.12);


    transition:.3s;

}



.card:hover{

    transform:translateY(-8px);

}



.tag{

    color:#1596dc;

    font-size:14px;

}



.card h2{

    margin-top:15px;

    font-size:25px;

}



.desc{

    margin-top:15px;

    color:#637f96;

    line-height:1.6;

}



.info{

    margin-top:25px;

    color:#91a7b8;

    font-size:14px;

}



footer{

    text-align:center;

    padding:35px;

    color:#789;

}



@media(max-width:900px){

.container{

    flex-direction:column;

}

.sidebar{

    width:100%;

}

.posts{

    grid-template-columns:1fr;

}

}


</style>

</head>


<body>


<header>

<div class="logo">
🐋 Cyber<span>Whale</span> Blog
</div>


<nav>

<a href="#">
Home
</a>

<a href="#">
Projects
</a>

<a href="#">
About
</a>

</nav>


</header>




<div class="container">


<aside class="sidebar" id="category">

<h2>
分类
</h2>


</aside>



<section class="posts" id="posts">


</section>


</div>





<footer>

© 2026 CyberWhale

</footer>



<script>


const supabaseClient =
supabase.createClient(

"YOUR_SUPABASE_URL",

"YOUR_ANON_KEY"

);



let allPosts=[];




//读取文章

async function loadPosts(){


    let {data,error}=await supabaseClient

    .from("posts")

    .select("*")

    .order(
        "date",
        {
            ascending:false
        }
    );



    if(error){

        console.log(error);

        return;

    }



    allPosts=data;


    showPosts(allPosts);


    showCategory();


}





//显示文章

function showPosts(list){


    let box=
    document.getElementById("posts");


    box.innerHTML="";



    list.forEach(post=>{


        box.innerHTML+=`

        <div class="card">


            <div class="tag">

            ${post.category}

            </div>



            <h2>

            ${post.title}

            </h2>



            <p class="desc">

            ${post.description || ""}

            </p>



            <div class="info">

            ${post.author || "Unknown"}

            ·

            ${post.date || ""}

            </div>


        </div>

        `;


    });


}






//分类

function showCategory(){


    let box=
    document.getElementById("category");



    let categories=[

        "全部",

        ...new Set(

            allPosts.map(

                x=>x.category

            )

        )

    ];



    box.innerHTML="<h2>分类</h2>";



    categories.forEach(

        (item,index)=>{


        box.innerHTML+=`

        <div class="category ${index==0?"active":""}"

        onclick="filter('${item}')">

        ${item=="全部"?"🐋":"📚"}

        ${item}

        </div>

        `;


        }

    );


}





//筛选

function filter(category){


    let buttons=
    document.querySelectorAll(".category");


    buttons.forEach(

        x=>x.classList.remove("active")

    );


    event.target.classList.add("active");



    if(category=="全部"){

        showPosts(allPosts);

        return;

    }



    showPosts(

        allPosts.filter(

            x=>x.category==category

        )

    );


}





loadPosts();


</script>


</body>
</html>
