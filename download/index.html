<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>下载中心 · CyberWhale</title>
<link rel="icon" type="image/png" href="https://i.imgs.ovh/2026/05/02/bf29034af039328180ea8abd6d6abba5.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f8fcff,#dff3ff);color:#16324a;min-height:100vh}
header{height:75px;display:flex;align-items:center;justify-content:space-between;padding:0 70px;background:rgba(255,255,255,.75);backdrop-filter:blur(20px);border-bottom:1px solid #d9edff;position:sticky;top:0;z-index:20}
.logo{font-size:26px;font-weight:700;text-decoration:none;color:#16324a}.logo span{color:#168bd2}
nav{display:flex;align-items:center;gap:28px}nav a,.nav-btn{text-decoration:none;color:#5c7890;cursor:pointer;font-size:15px;border:0;background:none}nav a:hover,.nav-btn:hover{color:#168bd2}.user-name{color:#168bd2;font-size:14px}
.container{width:85%;margin:45px auto;display:flex;gap:35px}.sidebar{width:240px;padding:30px;height:max-content;background:rgba(255,255,255,.8);backdrop-filter:blur(20px);border-radius:25px;box-shadow:0 10px 30px rgba(0,120,200,.12);position:sticky;top:120px}.sidebar h2{margin-bottom:25px;font-size:22px}.category{padding:14px 18px;margin-bottom:12px;border-radius:15px;color:#567;cursor:pointer;transition:.3s}.category:hover,.category.active{background:#e4f4ff;color:#1388cf}.add-btn{width:100%;margin-top:10px;padding:13px 16px;border:0;border-radius:15px;background:#168bd2;color:#fff;font-size:14px;cursor:pointer;display:none}.add-btn:hover{background:#1179b9}
.main{flex:1}.page-title{margin-bottom:25px}.page-title h1{font-size:30px;margin-bottom:7px}.page-title p{color:#7894a8}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:25px}.card{padding:28px;background:rgba(255,255,255,.8);backdrop-filter:blur(20px);border-radius:25px;box-shadow:0 10px 30px rgba(0,120,200,.12);transition:.3s}.card:hover{transform:translateY(-6px)}.tag{color:#168bd2;font-size:14px}.card h2{margin-top:12px;font-size:23px}.desc{margin-top:12px;color:#637f96;line-height:1.6;min-height:48px}.meta{margin-top:18px;color:#91a7b8;font-size:13px;display:flex;flex-wrap:wrap;gap:12px}.downloads{margin-top:20px;display:flex;flex-wrap:wrap;gap:9px}.download-btn,.edit-btn,.delete-btn{border:0;border-radius:13px;padding:9px 13px;cursor:pointer;font-size:13px}.download-btn{background:#e4f4ff;color:#1388cf}.download-btn:hover{background:#d2edff}.edit-btn{background:#edf5ff;color:#466b8a}.delete-btn{background:#fff0f0;color:#c74d4d}.manage{margin-top:14px;display:flex;gap:8px}.empty{padding:45px;text-align:center;background:rgba(255,255,255,.8);border-radius:25px;color:#7894a8;grid-column:1/-1}footer{text-align:center;padding:35px;color:#789}
.modal-mask{position:fixed;inset:0;background:rgba(23,50,74,.32);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100}.modal{width:min(620px,92vw);max-height:88vh;overflow:auto;background:rgba(255,255,255,.96);border-radius:25px;padding:30px;box-shadow:0 20px 60px rgba(0,90,150,.22)}.modal h2{margin-bottom:22px}.form-row{margin-bottom:14px}.form-row label{display:block;margin-bottom:7px;font-size:14px;color:#567}.form-row input,.form-row select,.form-row textarea{width:100%;padding:12px 14px;border:1px solid #d6e9f7;border-radius:13px;outline:none;background:#fbfdff;color:#16324a;font:inherit}.form-row textarea{min-height:90px;resize:vertical}.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:#168bd2}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.cancel-btn,.save-btn{border:0;border-radius:13px;padding:10px 18px;cursor:pointer}.cancel-btn{background:#edf3f7;color:#567}.save-btn{background:#168bd2;color:#fff}.loading{padding:60px;text-align:center;color:#7894a8}
@media(max-width:900px){header{padding:0 24px}.container{width:92%;flex-direction:column}.sidebar{width:100%;position:static}.cards{grid-template-columns:1fr}nav{gap:14px}.user-name{display:none}}
</style>
</head>
<body>
<header>
<a class="logo" href="https://cyberwhale.net/">🐋 Cyber<span>Whale</span> Download</a>
<nav>
<a href="https://cyberwhale.net/">Home</a>
<a href="https://cyberwhale.net/blog/">Blog</a>
<a href="https://about.cyberwhale.net/">About</a>
<span class="user-name" id="userName"></span>
<button class="nav-btn" onclick="logout()">登出</button>
</nav>
</header>
<div class="container">
<aside class="sidebar">
<h2>分类</h2>
<div id="categoryList"></div>
<button class="add-btn" id="addBtn" onclick="openAdd()">＋ 添加下载项</button>
</aside>
<main class="main">
<div class="page-title"><h1>下载中心</h1><p>赛博鲸鱼百宝箱</p></div>
<div class="cards" id="cards"><div class="loading">正在加载...</div></div>
</main>
</div>
<footer>© 2026 CyberWhale</footer>
<div class="modal-mask" id="modalMask" onclick="maskClose(event)">
<div class="modal">
<h2 id="modalTitle">添加下载项</h2>
<input type="hidden" id="editId">
<div class="form-row"><label>名称</label><input id="name"></div>
<div class="form-row"><label>分类</label><input id="category" placeholder="例如：应用、ISO"></div>
<div class="form-row"><label>版本</label><input id="version"></div>
<div class="form-row"><label>更新日期</label><input id="date" type="date"></div>
<div class="form-row"><label>来源</label><input id="source"></div>
<div class="form-row"><label>来源网址</label><input id="sourceUrl"></div>
<div class="form-row"><label>说明</label><textarea id="description"></textarea></div>
<div class="form-row"><label>Windows 下载</label><input id="win"></div>
<div class="form-row"><label>macOS Intel 下载</label><input id="macIntel"></div>
<div class="form-row"><label>macOS Apple Silicon 下载</label><input id="macApple"></div>
<div class="form-row"><label>Linux 下载</label><input id="linux"></div>
<div class="form-row"><label>ISO 下载</label><input id="iso"></div>
<div class="modal-actions"><button class="cancel-btn" onclick="closeModal()">取消</button><button class="save-btn" onclick="saveItem()">保存</button></div>
</div>
</div>
<script>
const supabaseUrl="https://jxbxswghraiwucjnyhhh.supabase.co";
const supabaseKey="sb_publishable_g9aX_HIuZL6LBNM5RUxLYQ_gdi127En";
const client=supabase.createClient(supabaseUrl,supabaseKey);
let currentUser=null,currentProfile=null,items=[],currentCategory='全部';
const $=id=>document.getElementById(id);

async function init(){
    const {data:{session}}=await client.auth.getSession();
    if(!session){location.href='https://cyberwhale.net/login/?next=/download/';return;}
    currentUser=session.user;
    const {data:profile,error}=await client.from('profile').select('username,role,email').eq('email',currentUser.email).single();
    if(error||!profile){alert('无法读取用户信息');return;}
    currentProfile=profile;
    $('userName').textContent=profile.username+' · '+profile.role;
    if(profile.role==='admin'||profile.role==='writer') $('addBtn').style.display='block';
    await loadItems();
}
async function logout(){await client.auth.signOut();location.href='https://cyberwhale.net/login/';}
async function loadItems(){
    const {data,error}=await client.from('downloads').select('*').order('created_at',{ascending:false});
    if(error){$('cards').innerHTML='<div class="empty">读取下载数据失败：'+escapeHtml(error.message)+'</div>';return;}
    items=data||[];renderCategories();renderCards();
}
function renderCategories(){
    const cats=['全部',...new Set(items.map(x=>x.category||'其他'))];
    $('categoryList').innerHTML=cats.map(c=>`<div class="category ${c===currentCategory?'active':''}" onclick="setCategory('${jsEscape(c)}')">${escapeHtml(c)}</div>`).join('');
}
function setCategory(c){currentCategory=c;renderCategories();renderCards();}
function canEdit(item){return currentProfile.role==='admin'||(currentProfile.role==='writer'&&item.owner_id===currentUser.id);}
function renderCards(){
    const list=currentCategory==='全部'?items:items.filter(x=>(x.category||'其他')===currentCategory);
    if(!list.length){$('cards').innerHTML='<div class="empty">这个分类还没有下载项。</div>';return;}
    $('cards').innerHTML=list.map(item=>{
        const buttons=[['Windows',item.win_url],['macOS Intel',item.mac_intel_url],['macOS Apple',item.mac_apple_url],['Linux',item.linux_url],['ISO',item.iso_url]].filter(x=>x[1]).map(x=>`<button class="download-btn" onclick="window.open('${attrEscape(x[1])}','_blank')">${x[0]}</button>`).join('');
        const manage=canEdit(item)?`<div class="manage"><button class="edit-btn" onclick="openEdit(${item.id})">编辑</button><button class="delete-btn" onclick="deleteItem(${item.id})">删除</button></div>`:'';
        return `<article class="card"><div class="tag">${escapeHtml(item.category||'其他')}</div><h2>${escapeHtml(item.name)}</h2><p class="desc">${escapeHtml(item.description||'暂无说明')}</p><div class="meta"><span>版本 ${escapeHtml(item.version||'—')}</span><span>${escapeHtml(item.update_date||'')}</span><span>${escapeHtml(item.source||'')}</span><span>由 ${escapeHtml(item.owner_name||'CyberWhale')} 添加</span></div><div class="downloads">${buttons||'<span class="tag">暂无下载链接</span>'}</div>${manage}</article>`;
    }).join('');
}
function openAdd(){
    $('modalTitle').textContent='添加下载项';$('editId').value='';
    ['name','category','version','date','source','sourceUrl','description','win','macIntel','macApple','linux','iso'].forEach(id=>$(id).value='');
    $('modalMask').style.display='flex';
}
function openEdit(id){
    const item=items.find(x=>x.id===id);if(!item||!canEdit(item)) return;
    $('modalTitle').textContent='编辑下载项';$('editId').value=item.id;
    $('name').value=item.name||'';$('category').value=item.category||'';$('version').value=item.version||'';$('date').value=item.update_date||'';$('source').value=item.source||'';$('sourceUrl').value=item.source_url||'';$('description').value=item.description||'';$('win').value=item.win_url||'';$('macIntel').value=item.mac_intel_url||'';$('macApple').value=item.mac_apple_url||'';$('linux').value=item.linux_url||'';$('iso').value=item.iso_url||'';
    $('modalMask').style.display='flex';
}
function closeModal(){$('modalMask').style.display='none';}
function maskClose(e){if(e.target===$('modalMask')) closeModal();}
async function saveItem(){
    if(currentProfile.role!=='admin'&&currentProfile.role!=='writer') return;
    const row={name:$('name').value.trim(),category:$('category').value.trim()||'其他',version:$('version').value.trim(),update_date:$('date').value||null,source:$('source').value.trim(),source_url:$('sourceUrl').value.trim(),description:$('description').value.trim(),win_url:$('win').value.trim(),mac_intel_url:$('macIntel').value.trim(),mac_apple_url:$('macApple').value.trim(),linux_url:$('linux').value.trim(),iso_url:$('iso').value.trim()};
    if(!row.name){alert('名称不能为空');return;}
    const id=$('editId').value;
    let result;
    if(id) result=await client.from('downloads').update(row).eq('id',Number(id));
    else result=await client.from('downloads').insert({...row,owner_id:currentUser.id,owner_name:currentProfile.username});
    if(result.error){alert(result.error.message);return;}
    closeModal();await loadItems();
}
async function deleteItem(id){
    const item=items.find(x=>x.id===id);if(!item||!canEdit(item)) return;
    if(!confirm('确定删除「'+item.name+'」吗？')) return;
    const {error}=await client.from('downloads').delete().eq('id',id);
    if(error){alert(error.message);return;}await loadItems();
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function jsEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function attrEscape(s){return String(s).replace(/'/g,'%27');}
init();
</script>
</body>
</html>
