<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>下载中心 · CyberWhale</title>
<link rel="icon" type="image/png" href="https://i.imgs.ovh/2026/05/02/bf29034af039328180ea8abd6d6abba5.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{
	margin:0;
	padding:0;
	box-sizing:border-box;
}
body{
	font-family:Inter,"Segoe UI",sans-serif;
	background:linear-gradient(135deg,#f8fcff,#dff3ff);
	color:#16324a;
	min-height:100vh;
}
header{
	height:75px;
	display:flex;
	align-items:center;
	justify-content:space-between;
	padding:0 70px;
	background:rgba(255,255,255,.75);
	backdrop-filter:blur(20px);
	border-bottom:1px solid #d9edff;
}
.logo{
	font-size:26px;
	font-weight:700;
	text-decoration:none;
	color:#16324a;
}
.logo span{
	color:#168bd2;
}
nav{
	display:flex;
	align-items:center;
	gap:28px;
}
nav a,.nav-btn{
	text-decoration:none;
	color:#5c7890;
	cursor:pointer;
	font-size:15px;
	border:0;
	background:none;
}
nav a:hover,.nav-btn:hover{
	color:#168bd2;
}
.user-name{
	color:#168bd2;
	font-size:14px;
}
.container{
	width:85%;
	margin:45px auto;
	display:flex;
	gap:35px;
}
.sidebar{
	width:240px;
	padding:30px;
	height:max-content;
	background:rgba(255,255,255,.8);
	backdrop-filter:blur(20px);
	border-radius:25px;
	box-shadow:0 10px 30px rgba(0,120,200,.12);
}
.sidebar h2{
	margin-bottom:25px;
	font-size:22px;
}
.category{
	padding:14px 18px;
	margin-bottom:12px;
	border-radius:15px;
	color:#567;
	cursor:pointer;
	transition:.3s;
}
.category:hover,.category.active{
	background:#e4f4ff;
	color:#1388cf;
}
.main{
	flex:1;
	min-width:0;
}
.page-title{
	margin-bottom:25px;
}
.page-title h1{
	font-size:30px;
	margin-bottom:7px;
}
.page-title p{
	color:#7894a8;
}
.cards{
	display:flex;
	flex-direction:column;
	gap:15px;
}
.card{
	padding:20px 25px;
	background:rgba(255,255,255,.8);
	backdrop-filter:blur(20px);
	border-radius:20px;
	box-shadow:0 10px 30px rgba(0,120,200,.12);
	transition:.3s;
	display:flex;
	align-items:center;
	gap:25px;
}
.card:hover{
	transform:translateY(-4px);
}
.software-main{
	min-width:220px;
}
.tag{
	color:#168bd2;
	font-size:13px;
}
.card h2{
	margin-top:6px;
	font-size:20px;
}
.meta{
	flex:1;
	color:#91a7b8;
	font-size:13px;
	display:flex;
	align-items:center;
	gap:22px;
	flex-wrap:wrap;
}
.download-btn{
	display:inline-block;
	padding:10px 20px;
	border-radius:13px;
	background:#e4f4ff;
	color:#1388cf;
	text-decoration:none;
	font-size:14px;
	white-space:nowrap;
}
.download-btn:hover{
	background:#d2edff;
}
.no-download{
	color:#91a7b8;
	font-size:13px;
	white-space:nowrap;
}
.empty,.loading{
	padding:45px;
	text-align:center;
	background:rgba(255,255,255,.8);
	border-radius:25px;
	color:#7894a8;
}
footer{
	text-align:center;
	padding:35px;
	color:#789;
}
@media(max-width:900px){
	header{
		padding:0 24px;
	}
	.container{
		width:92%;
		flex-direction:column;
	}
	.sidebar{
		width:100%;
	}
	.card{
		align-items:flex-start;
		flex-direction:column;
		gap:12px;
	}
	.software-main{
		min-width:0;
	}
	.meta{
		gap:12px;
	}
	.user-name{
		display:none;
	}
	nav{
		gap:14px;
	}
}
</style>
</head>
<body>

<header>
<a class="logo" href="https://cyberwhale.net/">
	🐋 Cyber<span>Whale</span> Download
</a>
<nav>
	<a href="https://cyberwhale.net/">Home</a>
	<a href="https://cyberwhale.net/blog/">Blog</a>
	<a href="https://about.cyberwhale.net/">About</a>
	<span class="user-name" id="userName"></span>
	<button class="nav-btn" onclick="logout()">登出</button>
</nav>
</header>

<div class="container">

<aside class="sidebar">
	<h2>分类</h2>
	<div id="categoryList"></div>
</aside>

<main class="main">

<div class="page-title">
	<h1>下载中心</h1>
	<p>赛博鲸鱼百宝箱</p>
</div>

<div class="cards" id="cards">
	<div class="loading">正在加载...</div>
</div>

</main>
</div>

<footer>
© 2026 CyberWhale
</footer>

<script>
const supabaseUrl="https://jxbxswghraiwucjnyhhh.supabase.co";
const supabaseKey="sb_publishable_g9aX_HIuZL6LBNM5RUxLYQ_gdi127En";
const client=supabase.createClient(supabaseUrl,supabaseKey);

let items=[];
let currentCategory="全部";

const $=id=>document.getElementById(id);

async function init(){
	const {data:{session}}=await client.auth.getSession();

	if(!session){
		location.href="https://cyberwhale.net/login/?next=/download/";
		return;
	}

	const {data:profile}=await client
		.from("profile")
		.select("username,role,email")
		.eq("email",session.user.email)
		.single();

	if(profile){
		$("userName").textContent=profile.username+" · "+profile.role;
	}

	await loadItems();
}

async function loadItems(){
	const {data,error}=await client
		.from("download")
		.select("*")
		.order("id",{ascending:false});

	if(error){
		$("cards").innerHTML=
		'<div class="empty">读取下载数据失败：'+escapeHtml(error.message)+'</div>';
		return;
	}

	items=data||[];

	renderCategories();
	renderCards();
}

function renderCategories(){
	const labels=[
		"全部",
		...new Set(items.map(item=>item.label||"其他"))
	];

	$("categoryList").innerHTML=labels.map(label=>`
		<div class="category ${label===currentCategory?"active":""}"
		onclick="setCategory('${jsEscape(label)}')">
			${escapeHtml(label)}
		</div>
	`).join("");
}

function setCategory(label){
	currentCategory=label;
	renderCategories();
	renderCards();
}

function renderCards(){
	let list=items;

	if(currentCategory!=="全部"){
		list=items.filter(item=>
			(item.label||"其他")===currentCategory
		);
	}

	if(!list.length){
		$("cards").innerHTML=
		'<div class="empty">这个分类还没有下载项。</div>';
		return;
	}

	$("cards").innerHTML=list.map(item=>`
		<article class="card">

			<div class="software-main">
				<div class="tag">
					${escapeHtml(item.label||"其他")}
				</div>

				<h2>
					${escapeHtml(item.name||"未命名")}
				</h2>
			</div>

			<div class="meta">
				<span>版本：${escapeHtml(item.version||"—")}</span>
				<span>作者：${escapeHtml(item.author||"—")}</span>
				<span>日期：${escapeHtml(item.date||"—")}</span>
			</div>

			${
				item.file
				?
				`<a class="download-btn"
					href="${escapeAttr(item.file)}"
					target="_blank">
					下载
				</a>`
				:
				`<span class="no-download">暂无下载</span>`
			}

		</article>
	`).join("");
}

async function logout(){
	await client.auth.signOut();
	location.href="https://cyberwhale.net/login/";
}

function escapeHtml(s){
	return String(s??"").replace(/[&<>"']/g,c=>({
		"&":"&amp;",
		"<":"&lt;",
		">":"&gt;",
		'"':"&quot;",
		"'":"&#39;"
	}[c]));
}

function jsEscape(s){
	return String(s)
		.replace(/\\/g,"\\\\")
		.replace(/'/g,"\\'");
}

function escapeAttr(s){
	return String(s)
		.replace(/&/g,"&amp;")
		.replace(/"/g,"&quot;")
		.replace(/</g,"&lt;")
		.replace(/>/g,"&gt;");
}

init();
</script>

</body>
</html>
